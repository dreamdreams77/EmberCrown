let mode='title',lvl=0,perk=null,G=null,diff=1;
const HOUSE_NAMES={marrow:'Marrow',grell:'Grell',ostrander:'Ostrander',sable:'Sable',kest:'Kest',dunmoor:'Dunmoor'};
let houses={};
function resetHouses(){houses={};for(const k in HOUSE_NAMES)houses[k]={favor:0,fear:0,ruin:0};}
resetHouses();
function rep(){let f=0,e=0,r=0;for(const k in houses){f+=houses[k].favor;e+=houses[k].fear;r+=houses[k].ruin;}
  return{f,e,r,decay:1+.1*Math.min(f,4),sight:Math.max(.8,1-.03*e),gain:1+.05*e,fled:Math.floor(r/2),chaos:1+.05*r};}
function applyOutcome(){
  const L=[];
  const add=(h,t,n,msg)=>{houses[h][t]+=n;L.push('House '+HOUSE_NAMES[h]+': +'+n+' '+t[0].toUpperCase()+t.slice(1)+'. '+msg);};
  if(lvl===0)add('marrow','fear',1,'The thief who walked through their keep.');
  else if(lvl===1){
    if(perk==='bribe')add('grell','favor',1,'The steward remembers your coin.');
    else if(perk==='blackmail')add('grell','fear',1,'The chamberlain keeps your secret, for now.');
    else add('grell','ruin',1,'Grell wakes to a signature he does not remember.');
  } else if(lvl===2){
    add('ostrander','fear',1,'The beacons went dark in one night.');
    add('ostrander','ruin',1,'Forged letters turn their house on itself.');
  } else if(lvl===3){
    add('sable','fear',1,'The ledger names every bribe they took.');
    add('sable','ruin',1,'Their Bell-Warden is silenced.');
  } else if(lvl===4){
    add('kest','fear',1,'Their prize hostage walked out of Ironvale.');
    if(G.choice==='return')add('ostrander','favor',1,'Their heir comes home, unharmed.');
    else add('ostrander','fear',1,'You hold their heir over their heads.');
  } else if(lvl===5){
    add('dunmoor','ruin',1,'The forged treaty is now the first page of their war.');
    add('dunmoor','fear',1,"Veyra's signet is in your pocket.");
  } else if(lvl===6){
    G.ending=finaleEnding(G.choice);
    L.push(G.ending.sum);
  }
  G.outLines=L;
}
function houseCounts(){let f=0,e=0,r=0;for(const k in houses){if(houses[k].favor>0)f++;if(houses[k].fear>0)e++;if(houses[k].ruin>0)r++;}return{f,e,r};}
function finaleEnding(choice){
  const R=rep(),keys=Object.keys(houses);
  if(choice==='puppet'){
    let best=keys[0],bs=-1;
    for(const k of keys){const s=houses[k].fear*2+houses[k].favor;if(s>bs){bs=s;best=k;}}
    houses[best].fear+=1;
    return{title:'Ending: The Puppet Crown',col:'#c8b4ff',
      lines:['House '+HOUSE_NAMES[best]+' wears the crown, and every string runs back to the Hollow Crown.',
        R.e>=4?'The houses obey because they are afraid, not because they agree.':'The houses go along with it. Peace holds, for now.',
        R.f>=2?'A few of them even thank you. Wren does not sleep well anyway.':'Wren holds the strings and does not sleep well.'],
      sum:'House '+HOUSE_NAMES[best]+': crowned, +1 Fear.'};
  }
  if(choice==='burn'){
    for(const k of keys)houses[k].ruin+=1;
    return{title:'Ending: Ash and Ember',col:'#ff9a4a',
      lines:['Ashling burns the throne to slag, and then, with enthusiasm, the hall.',
        R.r>=4?'The houses you ruined along the way have nothing left to rebuild with. The marsh smolders for a generation.':'The houses are bruised, not broken. They rebuild fast, and find a new throne by spring.',
        'Ashling: In my defense, it was very flammable.'],
      sum:'Every house: +1 Ruin.'};
  }
  for(const k of keys)houses[k].favor+=1;
  return{title:'Ending: The Broken Throne',col:'#7be08a',
    lines:['Ashling, full grown, shatters the throne. No crown is left to fight over.',
      R.f>=3?'The houses you helped meet in the rubble and draft a charter. It holds.':'The houses scramble for order. It is a hard winter, but nobody has a crown to steal.',
      'Wren sends one last letter. This time she knows what it says.'],
    sum:'Every house: +1 Favor.'};
}
function finishLevel(){mode='win';applyOutcome();}
const DIFFS=[
 {name:'Courier',range:1,decay:1.3,smoke:1,bell:1,flute:0,blurb:'Gentler guards, extra gadgets'},
 {name:'Spy',range:1.1,decay:1,smoke:0,bell:0,flute:0,blurb:'The intended experience'},
 {name:'Shadow',range:1.2,decay:.7,smoke:-1,bell:-1,flute:-1,blurb:'Sharper eyes, slow recovery, no flute'}];
const stats={gems:0,caught:0,time:0,byLvl:[]};
const TOTAL_GEMS=LEVELS.reduce((s,l)=>s+l.map.join('').split('g').length-1,0);
const BREAK_GEMS=Math.round(TOTAL_GEMS*.6);
const keys={};

/* ---------- helpers ---------- */
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d);}
function solidTile(tx,ty){
  if(tx<0||ty<0||tx>=GW||ty>=GH)return true;
  if(G.flight)return false;
  if(G.grid[ty][tx]==='#')return true;
  const d=G.doors[tx+','+ty];return !!(d&&!d.open);
}
function blocked(x,y,r){
  return solidTile(Math.floor((x-r)/T),Math.floor((y-r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y-r)/T))||
         solidTile(Math.floor((x-r)/T),Math.floor((y+r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y+r)/T));
}
function inSmoke(x,y){
  return G.smoke.some(s=>Math.hypot(s.x-x,s.y-y)<s.r)||
    (G.state==='ball'&&G.guests&&G.guests.some(s=>Math.hypot(s.x-x,s.y-y)<11));
}
function unstick(c){
  if(!blocked(c.x,c.y,8))return;
  const tx=Math.floor(c.x/T),ty=Math.floor(c.y/T);
  for(let r=1;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=(tx+dx)*T+16,ny=(ty+dy)*T+16;
    if(!blocked(nx,ny,8)){c.x=nx;c.y=ny;return;}
  }
}
function shiftTime(){
  const ts=G.d.timeshift,toRuin=G.state==='ball';
  G.state=toRuin?'ruin':'ball';
  const t=G.guards;G.guards=G.otherGuards;G.otherGuards=t;
  G.grid=G.baseGrid.map(r=>r.slice());
  if(toRuin){
    for(const [x,y] of ts.ruin.open)G.grid[y][x]='.';
    if(G.planted)for(const [x,y] of ts.ruin.openIfPlanted)G.grid[y][x]='.';
    for(const [x,y] of ts.ruin.block)G.grid[y][x]='#';
  }
  buildBg(G);G.shake=.3;
  G.vents=toRuin?G.ruinVents:[];
  G.rangeMul=G.baseRange*(toRuin?1.1:.9);
  unstick(G.wren);unstick(G.ash);
  G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:220,c:toRuin?'220,130,80':'240,210,130'});
  lureNear(G.wren.x,G.wren.y,8*T);
  say('Wren',toRuin?'Three years on. The hall remembers what it became.':'The ball again. Mind the masks.');
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/6);
  for(let i=1;i<n;i++){
    const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;
    if(solidTile(Math.floor(x/T),Math.floor(y/T))||inSmoke(x,y))return false;
  }
  return true;
}
function say(who,text){G.msg={who,text};G.msgT=4;}

/* ---------- level loading ---------- */
function loadLevel(i){
  const d=LEVELS[i];
  const g={d,grid:[],items:[],doors:{},smoke:[],parts:[],lights:[],rings:[],active:'wren',alert:0,hold:0,holdT:null,
    time:0,gems:0,msg:null,msgT:0,fireSaid:false,doneSaid:false,sneak:false,gad:{...d.gadgets},exitOpen:false,flight:!!d.flight,vents:[],peds:[],ventSaid:false,gain:1,choice:null,outLines:[],
    host:d.choice?{x:0,y:0,on:false,host:true,face:0}:null};
  const D=DIFFS[diff];
  if(!d.flight)for(const k of ['smoke','bell','flute'])g.gad[k]=Math.max(0,g.gad[k]+D[k]);
  let start,ex;
  d.map.forEach((row,y)=>{
    g.grid[y]=[];
    for(let x=0;x<GW;x++){
      let c=row[x];
      if(c==='S'){start=[x,y];c='.';}
      else if(c==='X'){ex=[x,y];c='.';}
      else if(c==='D'){g.doors[x+','+y]={x,y,open:false};c='.';}
      else if(c==='Z'){g.doors[x+','+y]={x,y,open:false,sealed:true};c='.';}
      else if(c==='T'){g.peds.push({x:x*T+16,y:y*T+16});c='.';}
      else if(c==='V'){g.vents.push({x,y,ph:(x*.7+y*1.3)%4,on:false,warn:false});c='.';}
      else if('gOPBLHC'.includes(c)){g.items.push({x:x*T+16,y:y*T+16,type:c,done:false,p:0});c='.';}
      g.grid[y][x]=c;
    }
  });
  g.exit={x:ex[0]*T+16,y:ex[1]*T+16};
  g.wren={x:start[0]*T+16,y:start[1]*T+16,face:0};
  g.ash={x:g.wren.x+(i>0?T:0),y:g.wren.y,face:0,on:i>0};
  if(g.flight){g.wren.hidden=true;g.ash.x=g.wren.x;g.ash.y=g.wren.y;g.active='ash';}
  const R=rep();
  g.rangeMul=((perk==='poison'&&i===1)?0.75:1)*D.range*R.sight;
  g.decay=((perk==='blackmail'&&i===1)?2.5:1)*D.decay*R.decay;
  g.gain=R.gain;
  const spd=(perk==='poison'&&i===1)?44:56;
  g.guards=d.guards.filter((_,k)=>!(perk==='bribe'&&i===1&&k===d.bribeIdx)).map(wp=>({
    x:wp[0][0]*T+16,y:wp[0][1]*T+16,wp:wp.map(p=>[p[0]*T+16,p[1]*T+16]),i:1,
    face:Math.atan2(wp[1][1]-wp[0][1],wp[1][0]-wp[0][0]),stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd,rm:d.flight?.8:1}));
  if(R.fled>0)g.guards.splice(Math.max(1,g.guards.length-R.fled),Math.min(R.fled,g.guards.length-1));
  for(const x of g.guards)x.spd*=R.chaos;
  // Ashling starts on the open tile beside Wren that is farthest from any guard
  if(!g.flight){let bs=-1;
    for(const [ox,oy] of [[T,0],[0,-T],[0,T],[-T,0],[0,0]]){const x=g.wren.x+ox,y=g.wren.y+oy;
      if(g.grid[y/T|0][x/T|0]==='#')continue;
      const s=Math.min(...g.guards.map(q=>Math.hypot(q.x-x,q.y-y)));if(s>bs+1){bs=s;g.ash.x=x;g.ash.y=y;}}}
  if(d.finale){

      G.rings.push({x:A.x,y:A.y,t:.3,r,c:'210,200,230',a:.22});
      for(const g of G.guards){
        if(g.stun>0||g.seeing||g.lure||g.ret||g.spin||(g.boss&&g.kind!=='candle'))continue;
        const ang=Math.atan2(A.y-g.y,A.x-g.x);
        if(Math.hypot(g.x-A.x,g.y-A.y)<r&&angDiff(ang,g.face)>.62){

  if(keys['e']&&G.near){

  } else {G.hold=0;G.holdT=null;}

      if(c&&Math.hypot(it.x-c.x,it.y-c.y)<16){

        stats.gems=stats.byLvl.reduce((a,b)=>a+(b||0),0);
        G.rings.push({x:it.x,y:it.y,t:.5,r:36,c:'255,154,60'});
        burst(it.x,it.y,12,'spark',80,.6);

      }
    }
  }
  // dragon fire
  const firing=G.active==='ash'&&keys[' '];
  if(firing){
    const a=G.ash,range=62+Math.min(stats.gems,12)*8;
    for(let i=0;i<3;i++){
      const sp=(Math.random()-.5)*.65,v=range*(3.6+Math.random()*1.6);
      G.parts.push({k:'fire',x:a.x+Math.cos(a.face)*10,y:a.y+Math.sin(a.face)*10,vx:Math.cos(a.face+sp)*v,vy:Math.sin(a.face+sp)*v,t:.32,t0:.32,r:3+Math.random()*3,drag:1});
    }
    if(Math.random()<dt*20)G.parts.push({k:'spark',x:a.x,y:a.y,vx:Math.cos(a.face)*range*2+(Math.random()-.5)*60,vy:Math.sin(a.face)*range*2+(Math.random()-.5)*60,t:.5,t0:.5,r:1});
    const inCone=(x,y)=>{const dx=x-a.x,dy=y-a.y;return Math.hypot(dx,dy)<range&&angDiff(Math.atan2(dy,dx),a.face)<.6&&los(a.x,a.y,x,y);};

          g.hurt=.1;
          if(!G.shieldSaid){G.shieldSaid=true;say('Ashling','My fire slides right off. The candles are shielding him!');}
        } else if(angDiff(Math.atan2(a.y-g.y,a.x-g.x),g.face)>1.3){
          g.hp-=22*dt;g.hurt=.15;
          if(g.hp<=0){g.hp=0;g.dead=true;g.stun=1e9;G.shake=.4;burst(g.x,g.y,30,'spark',120,1);
            if(g.kind==='candle')say('Candlemaker','Burn it, crown it, break it. I was always one step ahead.');
            else say('Ashling','The bell is quiet. So is he. Mostly.');}
        } else G.alert=Math.min(.95,G.alert+.5*dt);
      } else {g.stun=5;g.found=false;G.alert=Math.min(.95,G.alert+.15);burst(g.x,g.y,6,'smoke',25,1);}
    }
    for(const it of G.items){
      if(it.type==='B'&&!it.done&&inCone(it.x,it.y)){
        it.p+=dt;

  } else for(const it of G.items)if(it.type==='B'&&!it.done)it.p=Math.max(0,it.p-dt*.5);
  // living fire: beacons, torches, and the weather
  for(const it of G.items)if(it.type==='B'){
    if(!it.done){
      if(Math.random()<dt*16)G.parts.push({k:'fire',x:it.x+(Math.random()-.5)*10,y:it.y-6,vx:(Math.random()-.5)*12,vy:-30-Math.random()*30,t:.5,t0:.5,r:3+Math.random()*2});
      if(Math.random()<dt*3)G.parts.push({k:'spark',x:it.x,y:it.y-8,vx:(Math.random()-.5)*30,vy:-50-Math.random()*40,t:1,t0:1,r:1});
    } else if(Math.random()<dt*4)G.parts.push({k:'smoke',x:it.x,y:it.y-4,vx:(Math.random()-.5)*6,vy:-14,t:2.2,t0:2.2,r:5});

    else if(wx==='dust')G.parts.push({k:'dust',x:Math.random()*800,y:Math.random()*480,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*4,t:5,t0:5,r:1});
    else if(wx==='ash')G.parts.push({k:'ash',x:Math.random()*900-100,y:-5,vx:10+Math.random()*8,vy:16+Math.random()*10,t:28,t0:28,r:1.3});
  }
  if(pal.weather==='rain'){G.flashT-=dt;if(G.flashT<=0){G.flashT=6+Math.random()*8;G.flash=.35;G.shake=Math.max(G.shake,.12);}}
  if(G.flash>0)G.flash-=dt;
  // detection: light and shadow change how far a guard can see you
  gatherLights();
  let best=0;
  const targets=G.flight?[]:[G.wren];if(G.ash.on)targets.push(G.ash);
  if(G.host&&G.host.on)targets.push(G.host);
  for(const g of G.guards){

      const isActive=t.host?true:(t===G.wren)===(G.active==='wren');

      if(g===b||g.stun>0||g.spin||g.boss)continue;
      const dx=b.x-g.x,dy=b.y-g.y,dd=Math.hypot(dx,dy);
      if(dd<4.2*T*G.rangeMul&&angDiff(Math.atan2(dy,dx),g.face)<.62&&los(g.x,g.y,b.x,b.y)){
        b.found=true;G.alert=Math.min(.95,G.alert+.22*G.gain);
        if(!g.lure&&!g.ret)g.back={x:g.x,y:g.y};
        g.lure={x:b.x,y:b.y,t:2.5};g.ret=false;bark(g,BARKS.body);
        if(!G.bodySaid){G.bodySaid=true;say('Wren','They found him. Next time, pick a quieter corner.');}
        break;
      }
    }
  }
  for(const g of G.guards)stepGuard(g,dt);
  // Bell-Warden: the bell tolls; whoever you control must stand still when it lands
  const B=G.boss;
  if(B){
    if(B.hurt>0)B.hurt-=dt;
    if(B.kind==='candle'&&!B.dead){
      // the Candlemaker is always one step ahead: he marks a spot near you, then blinks there
      B.blinkT-=dt;
      if(B.blink){
        B.blink.t-=dt;

          const q=B.blink;burst(B.x,B.y,14,'smoke',50,.9);
          B.x=q.x;B.y=q.y;B.face=Math.atan2(A.y-B.y,A.x-B.x);B.lure=null;B.ret=false;B.pause=.8;B.blink=null;
          G.rings.push({x:q.x,y:q.y,t:.6,r:70,c:'255,120,60'});burst(q.x,q.y,16,'spark',90,.6);G.shake=Math.max(G.shake,.15);
          if(Math.hypot(A.x-q.x,A.y-q.y)<2.2*T){G.alert+=.45;say('Candlemaker','Still one step behind, little courier?');}

    }

  if(G.msgT>0)G.msgT-=dt;

  const ex=G.flight?G.ash:G.wren;
  if(G.exitOpen&&(G.flight||G.active==='wren')&&Math.hypot(ex.x-G.exit.x,ex.y-G.exit.y)<20

    if(G.d.choice||G.d.finale)mode='choice';else finishLevel();
  }
  anim(G.wren);anim(G.ash);anim(G.host);
  for(const g of G.guards)anim(g);
  if(G.guests)for(const s of G.guests)anim(s);

}

    bubble(p.x,p.y-22,'E  '+lab,'#eadfd0');
  }
}
function drawWeather(p){
  if(p.weather==='rain'){
    ctx.strokeStyle='rgba(170,195,230,.35)';ctx.lineWidth=1;ctx.beginPath();
    for(const d of G.rain){if(mode==='play'){d.y+=560*fdt;d.x-=140*fdt;}if(d.y>490){d.y=-10;d.x=Math.random()*900;}if(d.x<-20)d.x+=900;
      ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.l*.25,d.y-d.l);}
    ctx.stroke();
  } else if(p.weather==='fog'){
    for(const f of G.fog){if(mode==='play')f.x+=f.v*fdt;if(f.x-f.r>820)f.x=-f.r;
      ctx.globalAlpha=.09;ctx.drawImage(glow('190,205,235'),f.x-f.r*1.6,f.y-f.r*.6,f.r*3.2,f.r*1.2);}
    ctx.globalAlpha=1;
  }
}
function drawActiveMarker(){
  const a=G.active==='wren'?G.wren:G.ash;if(a.hidden)return;
  const r=(G.active==='wren'?13:16)+Math.sin(now*4)*1.2;
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.lineDashOffset=-now*10;
  ctx.beginPath();ctx.ellipse(a.x,a.y+4,r,r*.6,0,0,7);ctx.stroke();ctx.setLineDash([]);
}
function drawWorld(){
  const p=curPal(G);
  ctx.save();
  if(G.shake>0){G.shake=Math.max(0,G.shake-fdt);const s=G.shake*14;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
  ctx.fillStyle='#07050a';ctx.fillRect(-20,-20,840,520);
  ctx.drawImage(G.bg,0,0);
  if(G.flight){ctx.strokeStyle='rgba(150,220,230,.18)';ctx.lineWidth=1.2;ctx.beginPath();
    for(const w of G.waves){const o=Math.sin(now*1.6+w.ph)*4;ctx.moveTo(w.x+o-6,w.y);ctx.quadraticCurveTo(w.x+o,w.y-3,w.x+o+6,w.y);}ctx.stroke();}
  drawFloorThings();
  const polys=[];for(const g of G.guards)if(g.stun<=0)polys.push([g,visPoly(g,coneRange(g))]);
  drawActiveMarker();
  const actors=[];
  for(const g of G.guards)actors.push([g.stun>0?g.y-20:g.y,()=>drawGuard(g)]);
  if(G.guests&&G.state==='ball')for(const s of G.guests)actors.push([s.y,()=>drawGuest(s)]);
  if(G.host&&G.host.on)actors.push([G.host.y,()=>drawPerrin(G.host)]);
  if(!G.wren.hidden)actors.push([G.wren.y,()=>drawWren(G.wren)]);
  if(G.ash.on)actors.push([G.flight?1e9:G.ash.y,()=>drawAsh(G.ash)]);
  actors.sort((a,b)=>a[0]-b[0]).forEach(a=>a[1]());
  drawSmoke();
  drawParts(false);
  drawLighting(p,polys);
  drawEmissive();
  drawParts(true);
  drawCones(polys);
  drawWeather(p);
  drawOverlays();
  if(G.state==='ruin'){ctx.fillStyle='rgba(70,20,10,.16)';ctx.fillRect(0,0,800,480);}
  else if(G.state==='ball'){ctx.fillStyle='rgba(40,60,130,.06)';ctx.fillRect(0,0,800,480);}
  if(G.flash>0){ctx.fillStyle='rgba(220,230,255,'+Math.min(.5,G.flash*1.4)+')';ctx.fillRect(0,0,800,480);}
  ctx.drawImage(VIG,0,0);
  if(G.alert>.45){const k=Math.min(1,(G.alert-.45)/.55),beat=.6+.4*Math.sin(now*(6+k*8));
    ctx.globalAlpha=k*beat*.8;ctx.drawImage(VIG,0,0);ctx.fillStyle='rgba(200,30,30,'+(k*beat*.12)+')';ctx.fillRect(0,0,800,480);ctx.globalAlpha=1;}
  ctx.restore();
}

/* ---------- HUD and screens ---------- */
function keyCap(x,y,k){
  ctx.font='bold 10px Georgia';const w=Math.max(15,ctx.measureText(k).width+8);
  ctx.fillStyle='#2a2033';rrect(x,y-11,w,15,3);ctx.fill();ctx.strokeStyle='#7a6a8a';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#eadfd0';ctx.textAlign='center';ctx.fillText(k,x+w/2,y);ctx.textAlign='left';return w;
}
function icon(kind,x,y){
  if(kind==='smoke'){for(const[a,b,r]of[[-3,1,4],[3,1,4],[0,-3,4.5]])ell(x+a,y+b,r,r,'#b8b8c4');}
  else if(kind==='bell'){ctx.fillStyle='#e0b040';ctx.beginPath();ctx.moveTo(x-2,y-6);ctx.quadraticCurveTo(x-4,y,x-7,y+4);ctx.lineTo(x+7,y+4);ctx.quadraticCurveTo(x+4,y,x+2,y-6);ctx.closePath();ctx.fill();ell(x,y+5,1.6,1.4,'#7a5a18');}
  else if(kind==='flute'){ctx.save();ctx.translate(x,y);ctx.rotate(-.5);ctx.fillStyle='#e8dcc0';ctx.fillRect(-8,-2,16,4);ell(-8,0,2.4,3,'#e8dcc0');ell(8,0,2.4,3,'#e8dcc0');ctx.fillStyle='#5a4a3a';for(let k=-4;k<=4;k+=4)ctx.fillRect(k-.5,-1,1.5,2);ctx.restore();}
  else if(kind==='gem'){ctx.fillStyle='#b8461a';diamond(x,y,5,7);ctx.fill();ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x+5,y);ctx.lineTo(x,y+1);ctx.lineTo(x-5,y);ctx.fill();}
  else if(kind==='fire'){ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.moveTo(x-4,y+5);ctx.quadraticCurveTo(x-6,y-1,x,y-7);ctx.quadraticCurveTo(x+6,y-1,x+4,y+5);ctx.fill();ell(x,y+2,2,3,'#ffd27a');}
  else if(kind==='letter'){ctx.fillStyle='#eadfd0';ctx.fillRect(x-6,y-4,12,9);ctx.strokeStyle='#8a7a6a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-6,y-4);ctx.lineTo(x,y+1);ctx.lineTo(x+6,y-4);ctx.stroke();}
}
function portrait(who,x,y){
  ell(x,y,12,12,'#1a1220');ctx.strokeStyle=who==='Wren'?'#c8b4ff':'#ff9a4a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.stroke();
  if(who==='Wren'){ell(x,y+3,9,7,'#46346b');ell(x,y-1,6.5,7,'#6a55a0');ell(x,y,4,4.6,'#e6c4a0');ell(x-1.5,y,.8,.9,'#2a1a2a');ell(x+1.5,y,.8,.9,'#2a1a2a');}
  else{ctx.fillStyle='#ffe0a8';ctx.beginPath();ctx.moveTo(x-4,y-3);ctx.lineTo(x-7,y-9);ctx.lineTo(x-1,y-5);ctx.fill();ctx.beginPath();ctx.moveTo(x+4,y-3);ctx.lineTo(x+7,y-9);ctx.lineTo(x+1,y-5);ctx.fill();
    ell(x,y,7,6.5,'#ef7434');ell(x,y+3.5,4,3,'#e2642a');ell(x-2.5,y-1,1.2,1.2,'#fff2a0');ell(x+2.5,y-1,1.2,1.2,'#fff2a0');}
}
function drawHud(){
  let gr=ctx.createLinearGradient(0,0,0,28);gr.addColorStop(0,'rgba(8,5,12,.95)');gr.addColorStop(1,'rgba(8,5,12,.72)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,800,27);ctx.fillStyle='rgba(240,180,76,.35)';ctx.fillRect(0,27,800,1);
  gr=ctx.createLinearGradient(0,452,0,480);gr.addColorStop(0,'rgba(8,5,12,.72)');gr.addColorStop(1,'rgba(8,5,12,.95)');
  ctx.fillStyle=gr;ctx.fillRect(0,452,800,28);ctx.fillStyle='rgba(240,180,76,.35)';ctx.fillRect(0,452,800,1);
  ctx.font='bold 13px Georgia';
  let x=10;
  ctx.fillStyle='#f0b44c';ctx.fillText(G.d.name,x,18);x+=ctx.measureText(G.d.name).width+18;
  ctx.font='12px Georgia';
  for(const t of ['L','H','C','O','P','B','W']){
    const l=G.d.labels[t];if(!l)continue;
    let its,n,done;
    if(t==='W'){done=!!G.boss.dead;its=[0];n=done?1:0;}
    else{its=G.items.filter(i=>i.type===t);n=its.filter(i=>i.done).length;done=n===its.length;}
    ctx.strokeStyle=done?'#7be08a':'#9a8aa0';ctx.lineWidth=1.2;ctx.strokeRect(x+.5,8.5,9,9);
    if(done){ctx.strokeStyle='#7be08a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+2,13);ctx.lineTo(x+4.5,16);ctx.lineTo(x+9,9);ctx.stroke();}
    ctx.fillStyle=done?'#7be08a':'#eadfd0';
    const s=l+(its.length>1?' '+n+'/'+its.length:'');ctx.fillText(s,x+14,18);x+=ctx.measureText(s).width+28;
  }
  // bottom bar: who, gadgets, gems, light, suspicion
  const who=G.active==='wren'?'Wren':'Ashling',y=471;
  portrait(who,20,466);
  ctx.font='bold 13px Georgia';ctx.fillStyle=who==='Wren'?'#c8b4ff':'#ff9a4a';ctx.fillText(who,38,y);
  x=38+ctx.measureText(who).width+8;
  if(G.ash.on&&!G.flight){x+=keyCap(x,y,'TAB')+12;}else x+=6;
  ctx.font='bold 12px Georgia';
  const gad=(k,ic,val,dim)=>{x+=keyCap(x,y,k)+12;ctx.globalAlpha=dim?.4:1;icon(ic,x,y-4);ctx.fillStyle='#eadfd0';ctx.font='bold 12px Georgia';ctx.fillText(val,x+11,y);x+=ctx.measureText(val).width+24;ctx.globalAlpha=1;};
  if(G.flight){gad('SPACE','fire','Fire');gad('E','letter','Drop letters');}
  else{
    const wr=G.active!=='wren';
    gad('Q','smoke',''+G.gad.smoke,wr||!G.gad.smoke);gad('R','bell',''+G.gad.bell,wr||!G.gad.bell);
    gad('F','flute',G.d.timeshift?'Time':G.gad.flute>50?'Song':''+G.gad.flute,wr||!G.gad.flute);
  }
  icon('gem',x,y-4);ctx.fillStyle='#ffb070';ctx.fillText(''+stats.gems,x+9,y);x+=ctx.measureText(''+stats.gems).width+22;
  if(G.d.timeshift){ctx.fillStyle=G.state==='ball'?'#b9c8ff':'#e0a070';ctx.fillText(G.state==='ball'?'BALL':'RUINS',x,y);}
  // light gem: how exposed the active character is
  if(!G.flight){
    const A=G.active==='wren'?G.wren:G.ash,l=lightAt(A.x,A.y),lx=556;
    const c=l<.25?'60,70,120':l<.6?'200,150,80':'255,220,130';
    addGlow(lx,y-4,10+l*10,c,.5+l*.4);
    ctx.fillStyle='rgb('+c+')';diamond(lx,y-4,5,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.stroke();
    ctx.font='11px Georgia';ctx.fillStyle='#bfb0c8';ctx.fillText(l<.25?'Shadow':l<.6?'Dim':'Lit',lx+9,y);
  }
  // suspicion eye and bar
  const a=Math.min(1,G.alert),ex=612,ey=y-4,open=1.5+a*4.5;
  ctx.fillStyle='#eadfd0';ctx.beginPath();ctx.moveTo(ex-9,ey);ctx.quadraticCurveTo(ex,ey-open*1.4,ex+9,ey);ctx.quadraticCurveTo(ex,ey+open*1.4,ex-9,ey);ctx.fill();
  ell(ex,ey,Math.min(3.4,open*.7),Math.min(3.4,open*.7),a<.5?'#3a6a4a':a<.8?'#a07020':'#c02020');
  const col=a<.5?'#7be08a':a<.8?'#f0b44c':'#e05050';
  ctx.fillStyle='#1a1220';rrect(626,460,164,12,4);ctx.fill();
  if(a>0){ctx.save();rrect(626,460,164,12,4);ctx.clip();const g2=ctx.createLinearGradient(626,0,790,0);g2.addColorStop(0,'#3a8a4a');g2.addColorStop(1,col);ctx.fillStyle=g2;ctx.fillRect(626,460,164*a,12);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(626,460,164*a,3);ctx.restore();}
  ctx.strokeStyle='#6a5a7a';ctx.lineWidth=1;rrect(626.5,460.5,164,12,4);ctx.stroke();
  if(G.msgT>0&&G.msg){
    const c=G.msg.who==='Ashling'?'#ff9a4a':G.msg.who==='Perrin'?'#7fd0ff':G.msg.who==='Candlemaker'?'#f0d080':'#c8b4ff';
    ctx.globalAlpha=Math.min(1,G.msgT);
    ctx.font='bold 13px Georgia';const nw=ctx.measureText(G.msg.who+':').width,tw=nw+ctx.measureText(G.msg.text).width+40,bx=400-Math.max(300,tw)/2,bw=Math.max(300,tw);
    ctx.fillStyle='rgba(12,8,16,.9)';rrect(bx,412,bw,32,6);ctx.fill();
    ctx.strokeStyle=c;ctx.globalAlpha*=.6;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=Math.min(1,G.msgT);
    ctx.fillStyle=c;ctx.fillRect(bx,412,4,32);
    ctx.fillText(G.msg.who+':',bx+16,433);
    ctx.fillStyle='#eadfd0';ctx.font='13px Georgia';ctx.fillText(G.msg.text,bx+16+nw+8,433);
    ctx.globalAlpha=1;
  }
}
function drawBackdrop(){
  const g=ctx.createLinearGradient(0,0,0,480);g.addColorStop(0,'#1c1024');g.addColorStop(.65,'#100a14');g.addColorStop(1,'#060408');
  ctx.fillStyle=g;ctx.fillRect(0,0,800,480);
  addGlow(400,470,330,'255,110,40',.35);
  ctx.drawImage(SKY,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const e of TITLE_EMBERS){e.y-=e.v*fdt;e.x+=Math.sin(now+e.ph)*8*fdt;if(e.y<-10){e.y=490;e.x=Math.random()*800;}
    const r=e.r*4;ctx.globalAlpha=.5+.4*Math.sin(now*3+e.ph);ctx.drawImage(glow('255,150,60'),e.x-r,e.y-r,r*2,r*2);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function frameBox(x,y,w,h,col){
  ctx.strokeStyle=col;ctx.lineWidth=1;ctx.globalAlpha=.5;ctx.strokeRect(x+.5,y+.5,w,h);ctx.globalAlpha=.25;ctx.strokeRect(x+5.5,y+5.5,w-10,h-10);ctx.globalAlpha=1;
  ctx.fillStyle=col;for(const[cx,cy]of[[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){diamond(cx,cy,5,5);ctx.fill();}
}
function drawCrown(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  addGlow(0,0,40,'255,150,60',.5);
  const gr=ctx.createLinearGradient(0,-16,0,10);gr.addColorStop(0,'#ffe08a');gr.addColorStop(1,'#c0541c');ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(-22,10);ctx.lineTo(-24,-10);ctx.lineTo(-12,0);ctx.lineTo(0,-16);ctx.lineTo(12,0);ctx.lineTo(24,-10);ctx.lineTo(22,10);ctx.closePath();ctx.fill();
  ell(0,3,3,3,'#a82020');ell(-12,5,2,2,'#5fd0a0');ell(12,5,2,2,'#5fd0a0');
  ctx.restore();
}
function panel(title,lines,foot,col,overlay){
  col=col||'#f0b44c';
  if(overlay){ctx.fillStyle='rgba(8,5,12,.84)';ctx.fillRect(0,0,800,480);ctx.drawImage(VIG,0,0);}
  else drawBackdrop();
  frameBox(28,28,744,424,col);
  ctx.textAlign='center';
  const big=title==='EMBERCROWN';
  if(big)drawCrown(400,44,.9);
  ctx.font='bold '+(big?50:38)+'px Georgia';
  ctx.shadowColor=col;ctx.shadowBlur=22;
  if(big){const gr=ctx.createLinearGradient(0,70,0,110);gr.addColorStop(0,'#ffe08a');gr.addColorStop(1,'#e0641c');ctx.fillStyle=gr;}else ctx.fillStyle=col;
  ctx.fillText(title,400,big?106:96);ctx.shadowBlur=0;
  const tw=ctx.measureText(title).width/2+30,ly=big?120:112;
  ctx.strokeStyle=col;ctx.globalAlpha=.5;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(400-tw,ly);ctx.lineTo(400-8,ly);ctx.moveTo(400+8,ly);ctx.lineTo(400+tw,ly);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=col;diamond(400,ly,4,4);ctx.fill();
  ctx.font='16px Georgia';ctx.fillStyle='#eadfd0';
  lines.forEach((l,i)=>ctx.fillText(l,400,150+i*26));
  ctx.globalAlpha=.6+.4*Math.sin(now*3);ctx.fillStyle='#b8a8c0';ctx.fillText(foot,400,440);ctx.globalAlpha=1;
  ctx.textAlign='left';
}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function draw(){
  if(mode==='title'){
    panel('EMBERCROWN',[
      'A spy. A runt dragon. Seven feuding houses. One engineered war.','',
      'WASD / Arrows  move      Shift  sneak      Space  dragon fire      Tab  swap',
      'E (hold)  pick a lock, steal, poison, or knock out a guard you sneak up behind',
      'Q  smoke powder      R  whisper bell      F  bone flute (opens a door, loud)','',
      'Stay out of the cones. Torchlight gives you away; shadows hide you.',
      'Running is loud. Guards hunt where they last saw you, and notice the fallen.','',
      'Difficulty (press 1, 2 or 3):   '+DIFFS.map((d,i)=>(i===diff?'[ ':'  ')+(i+1)+' '+d.name+(i===diff?' ]':'  ')).join('   '),
      DIFFS[diff].blurb],'Press Enter to begin  -  Chapter I: The Hollow Crown');
  } else if(mode==='brief'){
    const d=LEVELS[lvl];
    const R=rep(),extra=(R.f+R.e+R.r>0)?['','Standing: Favor '+R.f+'   Fear '+R.e+'   Ruin '+R.r,
      'Suspicion fades '+Math.round((R.decay-1)*100)+'% faster   Guard sight -'+Math.round((1-R.sight)*100)+'%   Alert gain +'+Math.round((R.gain-1)*100)+'%   Guards fled '+R.fled]:[];
    let fin=[];
    if(d.finale){const hc=houseCounts();
      fin=['Favor sends +'+Math.min(3,hc.f)+' whisper bells   Fear stands down '+Math.min(3,hc.e)+' guards   Ruin: he starts at '+(100-8*hc.r)+' HP'];}
    panel(d.name,['Mission '+(lvl+1)+'  -  '+d.house,''].concat(d.intro,extra,fin),'Press Enter to begin');
  } else if(mode==='court'){
    panel('The Whisper Court',[
      'Before Gallowmere you may turn one servant of House Grell.','',
      '1   Bribe the steward  -  one guard sleeps through the feast',
      '2   Blackmail the chamberlain  -  suspicion fades much faster',
      '3   Taint the wine  -  guards are drowsy: shorter sight, slower steps','',
      'Every favor has a price. The houses will remember.'],'Press 1, 2 or 3');
  } else if(mode==='play'){
    drawWorld();drawHud();
  } else if(mode==='choice'&&G.d.finale){
    drawWorld();drawHud();
    const can=stats.gems>=BREAK_GEMS;
    panel('The Throne of Hallow',[
      'The Candlemaker is dead. The throne is yours to decide.','',
      '1   Crown a puppet  -  peace, held by strings',
      '2   Burn it all down  -  Ashling finishes what the war began',
      can?'3   Break the throne  -  no crown, no more wars'
         :'3   Break the throne  -  locked: needs '+BREAK_GEMS+' ember gems (you have '+stats.gems+')','',
      'There is no taking this back.'],can?'Press 1, 2 or 3':'Press 1 or 2','#f0d080',true);
  } else if(mode==='choice'){
    drawWorld();drawHud();
    panel('Perrin Ostrander',[
      'The heir of the Drowned Spire stands at the gate, breathing hard.','',
      '1   Return him to House Ostrander  -  an ally, if a little humbled',
      '2   Hold him as leverage  -  a bribe, and a house that fears you','',
      'Whatever you choose, House Kest will not forget who emptied their cell.'],'Press 1 or 2','#7fd0ff',true);
  } else if(mode==='win'){
    drawWorld();drawHud();
    const tot=G.items.filter(i=>i.type==='g').length;
    panel('Mission Complete',[G.d.name+' is behind you.','','Ember gems: '+G.gems+' / '+tot+'     Time: '+fmt(G.time),
      'Total gems: '+stats.gems+'  (more gems, longer dragon fire)',''].concat(G.outLines),'Press Enter to continue','#7be08a',true);
  } else if(mode==='lose'){
    drawWorld();drawHud();
    panel('CAUGHT',['Wren: ...that went poorly.','Ashling: I said nothing. Loudly.'],'Press Enter to retry the mission','#e05050',true);
  } else if(mode==='end'){
    const epi={
      bribe:'The steward drinks your coin and your secrets. Grell trusts no one now.',
      blackmail:'The chamberlain will keep your secret until he cannot. Tick, tick.',
      poison:'Grell wakes with a headache and a signature he does not remember.',
      null:'You took no favors, and owe none.'}[perk];
    const rank=stats.caught===0?'Ghost':stats.caught<3?'Courier':'Loud';
    const E=G.ending||{title:'Chapter I Complete',lines:[epi],col:'#f0b44c'};
    panel(E.title,E.lines.concat(['','Ember gems: '+stats.gems+' / '+TOTAL_GEMS+'     Times caught: '+stats.caught+'     Time: '+fmt(stats.time),
      'Rank: '+rank+'   ('+DIFFS[diff].name+')','',
      'Houses (Favor/Fear/Ruin):',
      Object.keys(houses).slice(0,3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     '),
      Object.keys(houses).slice(3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     ')]),
      'Press Enter to return to the title',E.col);
  }
}
let last=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t/1000;fdt=dt;
  if(mode==='play')update(dt);
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
