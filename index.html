let mode='title',lvl=0,perk=null,G=null,diff=1;
const HOUSE_NAMES={marrow:'Marrow',grell:'Grell',ostrander:'Ostrander',sable:'Sable',kest:'Kest',dunmoor:'Dunmoor'};
let houses={};
function resetHouses(){houses={};for(const k in HOUSE_NAMES)houses[k]={favor:0,fear:0,ruin:0};}
resetHouses();
function rep(){let f=0,e=0,r=0;for(const k in houses){f+=houses[k].favor;e+=houses[k].fear;r+=houses[k].ruin;}
  return{f,e,r,decay:1+.1*Math.min(f,4),sight:Math.max(.8,1-.03*e),gain:1+.05*e,fled:Math.floor(r/2),chaos:1+.05*r};}
function applyOutcome(){
  const L=[];
  const add=(h,t,n,msg)=>{houses[h][t]+=n;L.push('House '+HOUSE_NAMES[h]+': +'+n+' '+t[0].toUpperCase()+t.slice(1)+'. '+msg);};
  if(lvl===0)add('marrow','fear',1,'The thief who walked through their keep.');
  else if(lvl===1){
    if(perk==='bribe')add('grell','favor',1,'The steward remembers your coin.');
    else if(perk==='blackmail')add('grell','fear',1,'The chamberlain keeps your secret, for now.');
    else add('grell','ruin',1,'Grell wakes to a signature he does not remember.');
  } else if(lvl===2){
    add('ostrander','fear',1,'The beacons went dark in one night.');
    add('ostrander','ruin',1,'Forged letters turn their house on itself.');
  } else if(lvl===3){
    add('sable','fear',1,'The ledger names every bribe they took.');
    add('sable','ruin',1,'Their Bell-Warden is silenced.');
  } else if(lvl===4){
    add('kest','fear',1,'Their prize hostage walked out of Ironvale.');
    if(G.choice==='return')add('ostrander','favor',1,'Their heir comes home, unharmed.');
    else add('ostrander','fear',1,'You hold their heir over their heads.');
  } else if(lvl===5){
    add('dunmoor','ruin',1,'The forged treaty is now the first page of their war.');
    add('dunmoor','fear',1,"Veyra's signet is in your pocket.");
  } else if(lvl===6){
    G.ending=finaleEnding(G.choice);
    L.push(G.ending.sum);
  }
  G.outLines=L;
}
function houseCounts(){let f=0,e=0,r=0;for(const k in houses){if(houses[k].favor>0)f++;if(houses[k].fear>0)e++;if(houses[k].ruin>0)r++;}return{f,e,r};}
function finaleEnding(choice){
  const R=rep(),keys=Object.keys(houses);
  if(choice==='puppet'){
    let best=keys[0],bs=-1;
    for(const k of keys){const s=houses[k].fear*2+houses[k].favor;if(s>bs){bs=s;best=k;}}
    houses[best].fear+=1;
    return{title:'Ending: The Puppet Crown',col:'#c8b4ff',
      lines:['House '+HOUSE_NAMES[best]+' wears the crown, and every string runs back to the Hollow Crown.',
        R.e>=4?'The houses obey because they are afraid, not because they agree.':'The houses go along with it. Peace holds, for now.',
        R.f>=2?'A few of them even thank you. Shiloh does not sleep well anyway.':'Shiloh holds the strings and does not sleep well.'],
      sum:'House '+HOUSE_NAMES[best]+': crowned, +1 Fear.'};
  }
  if(choice==='burn'){
    for(const k of keys)houses[k].ruin+=1;
    return{title:'Ending: Ash and Ember',col:'#ff9a4a',
      lines:['Ashling burns the throne to slag, and then, with enthusiasm, the hall.',
        R.r>=4?'The houses you ruined along the way have nothing left to rebuild with. The marsh smolders for a generation.':'The houses are bruised, not broken. They rebuild fast, and find a new throne by spring.',
        'Ashling: In my defense, it was very flammable.'],
      sum:'Every house: +1 Ruin.'};
  }
  for(const k of keys)houses[k].favor+=1;
  return{title:'Ending: The Broken Throne',col:'#7be08a',
    lines:['Ashling, full grown, shatters the throne. No crown is left to fight over.',
      R.f>=3?'The houses you helped meet in the rubble and draft a charter. It holds.':'The houses scramble for order. It is a hard winter, but nobody has a crown to steal.',
      'Shiloh sends one last letter. This time she knows what it says.'],
    sum:'Every house: +1 Favor.'};
}
function finishLevel(){mode='win';applyOutcome();}

 {name:'Courier',range:1,decay:1.3,smoke:1,bell:1,flute:0,blurb:'Gentler guards, extra gadgets'},
 {name:'Spy',range:1.1,decay:1,smoke:0,bell:0,flute:0,blurb:'The intended experience'},

const TOTAL_GEMS=LEVELS.reduce((s,l)=>s+l.map.join('').split('g').length-1,0);
const BREAK_GEMS=Math.round(TOTAL_GEMS*.6);
const keys={};

/* ---------- helpers ---------- */
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d);}
function solidTile(tx,ty){
  if(tx<0||ty<0||tx>=GW||ty>=GH)return true;
  if(G.flight)return false;
  if(G.grid[ty][tx]==='#')return true;
  const d=G.doors[tx+','+ty];return !!(d&&!d.open);
}
function blocked(x,y,r){
  return solidTile(Math.floor((x-r)/T),Math.floor((y-r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y-r)/T))||
         solidTile(Math.floor((x-r)/T),Math.floor((y+r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y+r)/T));
}
function inSmoke(x,y){
  return G.smoke.some(s=>Math.hypot(s.x-x,s.y-y)<s.r)||
    (G.state==='ball'&&G.guests&&G.guests.some(s=>Math.hypot(s.x-x,s.y-y)<11));
}
function unstick(c){
  if(!blocked(c.x,c.y,8))return;
  const tx=Math.floor(c.x/T),ty=Math.floor(c.y/T);
  for(let r=1;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=(tx+dx)*T+16,ny=(ty+dy)*T+16;
    if(!blocked(nx,ny,8)){c.x=nx;c.y=ny;return;}
  }
}
function shiftTime(){
  const ts=G.d.timeshift,toRuin=G.state==='ball';
  G.state=toRuin?'ruin':'ball';
  const t=G.guards;G.guards=G.otherGuards;G.otherGuards=t;
  G.grid=G.baseGrid.map(r=>r.slice());
  if(toRuin){
    for(const [x,y] of ts.ruin.open)G.grid[y][x]='.';
    if(G.planted)for(const [x,y] of ts.ruin.openIfPlanted)G.grid[y][x]='.';
    for(const [x,y] of ts.ruin.block)G.grid[y][x]='#';
  }
  buildBg(G);G.shake=.3;
  G.vents=toRuin?G.ruinVents:[];
  G.rangeMul=G.baseRange*(toRuin?1.1:.9);
  unstick(G.wren);unstick(G.ash);
  G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:220,c:toRuin?'220,130,80':'240,210,130'});
  lureNear(G.wren.x,G.wren.y,8*T);
  say('Shiloh',toRuin?'Three years on. The hall remembers what it became.':'The ball again. Mind the masks.');
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/6);
  for(let i=1;i<n;i++){
    const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;
    if(solidTile(Math.floor(x/T),Math.floor(y/T))||inSmoke(x,y))return false;
  }
  return true;
}
function say(who,text){G.msg={who,text};G.msgT=4;sfx('talk',who,text);}

/* ---------- level loading ---------- */
function loadLevel(i){
  const d=LEVELS[i];
  const g={d,grid:[],items:[],doors:{},smoke:[],parts:[],lights:[],rings:[],active:'wren',alert:0,hold:0,holdT:null,
    time:0,gems:0,msg:null,msgT:0,fireSaid:false,doneSaid:false,sneak:false,gad:{...d.gadgets},exitOpen:false,flight:!!d.flight,vents:[],peds:[],ventSaid:false,gain:1,choice:null,outLines:[],
    host:d.choice?{x:0,y:0,on:false,host:true,face:0}:null};
  const D=DIFFS[diff];
  if(!d.flight)for(const k of ['smoke','bell','flute'])g.gad[k]=Math.max(0,g.gad[k]+D[k]);
  let start,ex;
  d.map.forEach((row,y)=>{
    g.grid[y]=[];
    for(let x=0;x<GW;x++){
      let c=row[x];
      if(c==='S'){start=[x,y];c='.';}
      else if(c==='X'){ex=[x,y];c='.';}
      else if(c==='D'){g.doors[x+','+y]={x,y,open:false};c='.';}
      else if(c==='Z'){g.doors[x+','+y]={x,y,open:false,sealed:true};c='.';}
      else if(c==='T'){g.peds.push({x:x*T+16,y:y*T+16});c='.';}
      else if(c==='V'){g.vents.push({x,y,ph:(x*.7+y*1.3)%4,on:false,warn:false});c='.';}
      else if('gOPBLHC'.includes(c)){g.items.push({x:x*T+16,y:y*T+16,type:c,done:false,p:0});c='.';}
      g.grid[y][x]=c;
    }
  });
  g.exit={x:ex[0]*T+16,y:ex[1]*T+16};
  g.wren={x:start[0]*T+16,y:start[1]*T+16,face:0};
  g.ash={x:g.wren.x+(i>0?T:0),y:g.wren.y,face:0,on:i>0};
  if(g.flight){g.wren.hidden=true;g.ash.x=g.wren.x;g.ash.y=g.wren.y;g.active='ash';}
  const R=rep();

      face:Math.atan2(wp[1][1]-wp[0][1],wp[1][0]-wp[0][0]),stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd:spd*R.chaos,rm:1});

      x:s[0][0]*T+16,y:s[0][1]*T+16,face:0,c:['#d9a441','#6aa0d9','#c06a9a','#7fc08a'][k%4]}));

function schedStep(tk,step,t,dur){

      const f=mf(m);

  }

  if(tk.comp&&tk.comp[sib]==='x'){for(const m of[deg(root),deg(root+2),deg(root+4)])tone(mf(m+12),dur*2.2,'sawtooth',.03,{t,lp:1500,dest});}
  const ch=tk.lead[bar][sib];
  if(ch&&ch!=='.'){
    const v=parseInt(ch,16),f=mf(deg(v)+12);

    else if(tk.lt==='harp'){tone(f,.9,'sine',.12,{t,a:.003,dest,rev:.4});tone(f*2,.4,'sine',.04,{t,dest,rev:.4});}
    else if(tk.lt==='saw')tone(f,dur*2.6,'sawtooth',.07,{t,a:.01,lp:1800,dest,rev:.15});
    else if(tk.lt==='strings'){tone(f,dur*3,'sawtooth',.05,{t,a:.08,lp:1500,dest,det:-6,rev:.35});tone(f,dur*3,'sawtooth',.05,{t,a:.08,lp:1500,dest,det:6,rev:.35});}
    else{tone(f,1.4,'sine',.09,{t,a:.12,dest,rev:.7});tone(f*1.5,1.2,'triangle',.03,{t,a:.2,dest,rev:.7});}
  }
  // percussion and tension layers grow with suspicion
  const P=tk.perc,vol=.12+I*.2,kick=()=>tone(125,.22,'sine',vol*1.8,{t,slide:45,dest}),
    hat=()=>noise(.04,.05+I*.05,'highpass',7000,{t,dest}),snare=()=>{noise(.12,.1+I*.1,'highpass',1800,{t,dest});tone(190,.08,'triangle',.08,{t,dest});},
    anvil=v=>{for(const [r,vv] of[[620,1],[1180,.6],[1710,.35]])tone(r,.55,'triangle',v*vv,{t,dest,rev:.2});noise(.03,v*1.5,'highpass',4000,{t,dest});};

SND.watch=function(dt){

      else if(it.type==='O'){if(lvl===0&&!G.d.song)sfx('egg');else if(G.d.song)sfx('objective');else sfx('paper');}
      else if(it.type==='P'){if(G.flight||G.d.timeshift)sfx('paper');else sfx('poison');}
      else if(it.type==='L')sfx('song');else if(it.type==='H')sfx('free');else if(it.type==='C')sfx('snuff');

    }
  }

  if(G.gems>G._gems)sfx('gem');G._gems=G.gems;
  if(G.smoke.length>G._sm)sfx('smoke');G._sm=G.smoke.length;
  if(G.gad.bell<G._bell)sfx('bell');G._bell=G.gad.bell;
  if(G.gad.flute<G._flute)sfx(G.d.timeshift?'flute':'flute');G._flute=G.gad.flute;
  if(G.state!==G._state)sfx('time');G._state=G.state;

const TOUCH={capable:('ontouchstart' in window)||navigator.maxTouchPoints>0,used:false,mover:null,fire:false,hold:false,stillT:0,run:false,ptr:new Map()};

cv.addEventListener('pointerdown',e=>{

// what E would act on right now: a lock, an objective, or an unaware guard's back
function findTarget(A){

    const d=G.doors[k];if(d.open||d.sealed)continue;
    const dd=Math.hypot(d.x*T+16-A.x,d.y*T+16-A.y);
    if(dd<44&&dd<bd){bd=dd;tgt={kind:'door',ref:d,need:.9,x:d.x*T+16,y:d.y*T+16};}
  }
  for(const it of G.items){
    if('OPLHC'.includes(it.type)&&!it.done&&
       (!G.d.timeshift||(it.type==='P'?G.state==='ball':it.type==='O'?G.state==='ruin':true))){
      const dd=Math.hypot(it.x-A.x,it.y-A.y);
      if(dd<34&&dd<bd){bd=dd;tgt={kind:'item',ref:it,need:it.type==='H'?1.6:it.type==='C'?.8:1.2,x:it.x,y:it.y};}
    }

  if(G.active==='wren'&&!G.flight)for(const g of G.guards){
    if(g.boss||g.spin||g.stun>0||g.seeing||g.lure)continue;
    const dd=Math.hypot(g.x-A.x,g.y-A.y);

  if(G.flash>0)G.flash-=dt;
  // detection: light and shadow change how far a guard can see you
  gatherLights();
  let best=0;
  const targets=G.flight?[]:[G.wren];if(G.ash.on)targets.push(G.ash);
  if(G.host&&G.host.on)targets.push(G.host);
  for(const g of G.guards){
    g.seeing=false;
    if(g.stun>0)continue;
    for(const t of targets){
      const isActive=t.host?true:(t===G.wren)===(G.active==='wren');
      let mul=(t===G.ash?1.45:1)*(isActive?1:.6)*G.rangeMul;
      if(t===G.wren&&G.sneak)mul*=.6;
      if(!G.flight)mul*=.82+.4*lightAt(t.x,t.y);
      const range=5.2*T*mul*(g.rm||1),dx=t.x-g.x,dy=t.y-g.y,dist=Math.hypot(dx,dy);
      if(dist<range&&((dist<T*.9&&!(t===G.wren&&G.sneak))||angDiff(Math.atan2(dy,dx),g.face)<.62)&&los(g.x,g.y,t.x,t.y)){
        g.seeing=true;g.face=Math.atan2(dy,dx);g.saw={x:t.x,y:t.y};
        best=Math.max(best,.45+(1-dist/range)*1.1);
      }
    }
  }
  if(best>0)G.alert+=best*dt*G.gain;else G.alert-=dt*.22*G.decay;
  G.alert=Math.max(0,G.alert);
  // a guard who loses sight of you goes to look where you were
  for(const g of G.guards){
    if(g.wasSee&&!g.seeing&&g.stun<=0&&!g.spin&&g.saw){
      if(!g.lure&&!g.ret)g.back={x:g.x,y:g.y};
      g.lure={x:g.saw.x,y:g.saw.y,t:2.4};g.ret=false;bark(g,BARKS.lost);
    }
    g.wasSee=g.seeing;
  }
  // a guard who spots a fallen comrade raises suspicion and goes to check
  for(const b of G.guards){
    if(b.stun<=0||b.found||b.boss||b.spin)continue;
    for(const g of G.guards){
      if(g===b||g.stun>0||g.spin||g.boss)continue;
      const dx=b.x-g.x,dy=b.y-g.y,dd=Math.hypot(dx,dy);
      if(dd<4.2*T*G.rangeMul&&angDiff(Math.atan2(dy,dx),g.face)<.62&&los(g.x,g.y,b.x,b.y)){
        b.found=true;G.alert=Math.min(.95,G.alert+.22*G.gain);
        if(!g.lure&&!g.ret)g.back={x:g.x,y:g.y};
        g.lure={x:b.x,y:b.y,t:2.5};g.ret=false;bark(g,BARKS.body);
        if(!G.bodySaid){G.bodySaid=true;say('Shiloh','They found him. Next time, pick a quieter corner.');}
        break;
      }
    }
  }
  for(const g of G.guards)stepGuard(g,dt);
  // Bell-Warden: the bell tolls; whoever you control must stand still when it lands
  const B=G.boss;
  if(B){
    if(B.hurt>0)B.hurt-=dt;
    if(B.kind==='candle'&&!B.dead){
      // the Candlemaker is always one step ahead: he marks a spot near you, then blinks there
      B.blinkT-=dt;
      if(B.blink){
        B.blink.t-=dt;
        if(B.blink.t<=0){
          const q=B.blink;burst(B.x,B.y,14,'smoke',50,.9);
          B.x=q.x;B.y=q.y;B.face=Math.atan2(A.y-B.y,A.x-B.x);B.lure=null;B.ret=false;B.pause=.8;B.blink=null;
          G.rings.push({x:q.x,y:q.y,t:.6,r:70,c:'255,120,60'});burst(q.x,q.y,16,'spark',90,.6);G.shake=Math.max(G.shake,.15);
          if(Math.hypot(A.x-q.x,A.y-q.y)<2.2*T){G.alert+=.45;say('Candlemaker','Still one step behind, little courier?');}
        }
      } else if(B.blinkT<=0){
        B.blinkT=8;
        for(let n=0;n<40;n++){
          const ang=Math.random()*6.283,rr=(1.6+Math.random()*1.4)*T,x=A.x+Math.cos(ang)*rr,y=A.y+Math.sin(ang)*rr;
          if(!blocked(x,y,12)){B.blink={x,y,t:1.3};G.rings.push({x,y,t:1.3,r:40,c:'255,120,60'});break;}
        }
      }
    }
    if(!B.dead&&B.kind!=='candle'){
      B.tollT-=dt;
      if(B.tollT<=0&&B.toll<=0){B.tollT=6;B.toll=.9;G.rings.push({x:B.x,y:B.y,t:.9,r:7*T,c:'255,200,80'});
        if(!G.tollSaid){G.tollSaid=true;say('Ashling','The bell! Freeze when it rings!');}}
      if(B.toll>0){B.toll-=dt;
        if(B.toll<=0){G.shake=Math.max(G.shake,.2);
          if(moving&&Math.hypot(A.x-B.x,A.y-B.y)<7*T){G.alert+=.3;say('Shiloh','It heard me move.');}}}
    }
  }
  // timers and particles
  G.smoke=G.smoke.filter(s=>(s.t-=dt)>0);
  G.rings=G.rings.filter(r=>(r.t-=dt)>0);
  for(const q of G.parts){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;
    if(q.drag){q.vx*=1-3*dt;q.vy*=1-3*dt;
      if(!G.flight&&solidTile(Math.floor(q.x/T),Math.floor(q.y/T))){q.vx=q.vy=0;q.t=Math.min(q.t,.08);}}
    else if(q.k==='ember'||q.k==='ash'||q.k==='dust')q.vx+=Math.sin(G.time*1.7+q.t0*7+q.y*.02)*8*dt;
    else if(q.k==='smoke'){q.vx*=1-1.5*dt;q.vy*=1-1.5*dt;}
  }
  G.parts=G.parts.filter(q=>q.t>0);
  if(G.parts.length>700)G.parts.splice(0,G.parts.length-700);
  if(G.msgT>0)G.msgT-=dt;
  if(G.joyT>0)G.joyT-=dt;
  // exit
  const req=G.items.filter(i=>'OPBLHC'.includes(i.type));
  G.exitOpen=req.every(i=>i.done)&&(!G.boss||G.boss.dead);
  if(G.exitOpen&&!G.doneSaid){G.doneSaid=true;say(G.flight?'Ashling':'Shiloh',G.flight?'Done. Land on the green pad.':'Objectives done. Get Shiloh to the gate.');}
  const ex=G.flight?G.ash:G.wren;
  if(G.exitOpen&&(G.flight||G.active==='wren')&&Math.hypot(ex.x-G.exit.x,ex.y-G.exit.y)<20
     &&(!G.host||Math.hypot(G.host.x-G.exit.x,G.host.y-G.exit.y)<90)){
    if(G.d.choice||G.d.finale)mode='choice';else finishLevel();
  }
  anim(G.wren);anim(G.ash);anim(G.host);
  for(const g of G.guards)anim(g);
  if(G.guests)for(const s of G.guests)anim(s);
  SND.watch(dt);
  if(G.alert>=1){mode='lose';stats.caught++;G.shake=.5;}
}

  ctx.beginPath();ctx.moveTo(-22,10);ctx.lineTo(-24,-10);ctx.lineTo(-12,0);ctx.lineTo(0,-16);ctx.lineTo(12,0);ctx.lineTo(24,-10);ctx.lineTo(22,10);ctx.closePath();ctx.fill();
  ctx.lineJoin='round';ctx.strokeStyle='rgba(30,10,40,.9)';ctx.lineWidth=1.8;ctx.stroke();
  ctx.fillStyle='rgba(255,250,220,.5)';ctx.beginPath();ctx.ellipse(-11,-3,5,1.6,-.6,0,7);ctx.fill();
  const was=INK;INK=true;ell(0,3,3,3,'#d02a2a');ell(-12,5,2,2,'#5fd0a0');ell(12,5,2,2,'#5fd0a0');INK=was;
  ctx.restore();
}
function panel(title,lines,foot,col,overlay){
  col=col||'#f0b44c';const F='"IM Fell English",Georgia';
  if(TOUCH.capable)foot=foot.replace('Press Enter to','Tap to').replace(/Press 1, 2 or 3|Press 1 or 2/,'Tap your choice');
  if(overlay){ctx.fillStyle='rgba(8,5,16,.7)';ctx.fillRect(0,0,800,480);ctx.drawImage(VIG,0,0,800,480);}
  else drawBackdrop();
  paper(34,16,732,448,5+(title.length%5),0,22);
  ctx.textAlign='center';
  const big=title==='EMBERCROWN';
  if(big)drawCrown(400,50,.95);
  ctx.font='bold '+(big?50:38)+'px '+F;
  ctx.lineJoin='round';ctx.strokeStyle='rgba(18,6,34,.95)';ctx.lineWidth=big?7:6;
  const ty=big?108:98;
  ctx.strokeText(title,400,ty);
  if(big){const gr=ctx.createLinearGradient(0,70,0,112);gr.addColorStop(0,'#ffe9a0');gr.addColorStop(.55,'#f08a2c');gr.addColorStop(1,'#b02c14');ctx.fillStyle=gr;}
  else{const gr=ctx.createLinearGradient(0,ty-30,0,ty+4);gr.addColorStop(0,shade(col,.55));gr.addColorStop(1,col);ctx.fillStyle=gr;}
  ctx.fillText(title,400,ty);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.save();ctx.beginPath();ctx.rect(0,ty-44,800,22);ctx.clip();ctx.fillText(title,400,ty-1);ctx.restore();
  const tw=ctx.measureText(title).width/2+30,ly=big?124:116;
  goldRule(400-tw,400+tw,ly,10);
  ctx.fillStyle='#f0d078';diamond(400,ly,5,5);ctx.fill();ctx.strokeStyle='rgba(20,8,30,.9)';ctx.lineWidth=1;ctx.stroke();
  ctx.font='16px '+F;ctx.fillStyle='#f3e6cc';
  lines.forEach((l,i)=>ctx.fillText(l,400,154+i*25.5));
  ctx.globalAlpha=.65+.35*Math.sin(now*3);ctx.fillStyle='#d8c4f0';ctx.font='italic 15px '+F;ctx.fillText(foot,400,438);ctx.globalAlpha=1;
  ctx.textAlign='left';
  if(big)drawTitleDragon();
}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function draw(){
  if(mode==='title'){
    panel('EMBERCROWN',[
      'A spy. A runt dragon. Seven feuding houses. One engineered war.','',
      ...(TOUCH.capable?[
      'Drag anywhere to walk: a short drag sneaks, a long drag runs',
      'Hold still next to something to pick, steal, poison, or knock out',
      'Tap Q R F and TAB in the bar below, hold a second finger to breathe fire','']:[
      'WASD / Arrows  move      Shift  sneak      Space  dragon fire      Tab  swap',
      'E (hold)  pick a lock, steal, poison, or knock out a guard you sneak up behind',
      'Q  smoke powder      R  whisper bell      F  bone flute (opens a door, loud)','']),
      'Stay out of the cones. Torchlight gives you away; shadows hide you.',
      'Running is loud. Guards hunt where they last saw you, and notice the fallen.','',
      (TOUCH.capable?'Difficulty (tap to change):   ':'Difficulty (press 1, 2 or 3):   ')+DIFFS.map((d,i)=>(i===diff?'[ ':'  ')+(i+1)+' '+d.name+(i===diff?' ]':'  ')).join('   '),
      DIFFS[diff].blurb],'Press Enter to begin. Chapter I: The Hollow Crown');
  } else if(mode==='brief'){
    const d=LEVELS[lvl];
    const R=rep(),extra=(R.f+R.e+R.r>0)?['','Standing: Favor '+R.f+'   Fear '+R.e+'   Ruin '+R.r,
      'Suspicion fades '+Math.round((R.decay-1)*100)+'% faster   Guard sight -'+Math.round((1-R.sight)*100)+'%   Alert gain +'+Math.round((R.gain-1)*100)+'%   Guards fled '+R.fled]:[];
    let fin=[];
    if(d.finale){const hc=houseCounts();
      fin=['Favor sends +'+Math.min(3,hc.f)+' whisper bells   Fear stands down '+Math.min(3,hc.e)+' guards   Ruin: he starts at '+(100-8*hc.r)+' HP'];}
    panel(d.name,['Mission '+(lvl+1)+': '+d.house,''].concat(d.intro,extra,fin),'Press Enter to begin');
  } else if(mode==='court'){
    panel('The Whisper Court',[
      'Before Gallowmere you may turn one servant of House Grell.','',
      '1   Bribe the steward: one guard sleeps through the feast',
      '2   Blackmail the chamberlain: suspicion fades much faster',
      '3   Taint the wine: drowsy guards, shorter sight and slower steps','',
      'Every favor has a price. The houses will remember.'],'Press 1, 2 or 3');
  } else if(mode==='play'){
    drawWorld();drawHud();drawTouch();
  } else if(mode==='choice'&&G.d.finale){
    drawWorld();drawHud();
    const can=stats.gems>=BREAK_GEMS;
    panel('The Throne of Hallow',[
      'The Candlemaker is dead. The throne is yours to decide.','',
      '1   Crown a puppet: peace, held by strings',
      '2   Burn it all down: Ashling finishes what the war began',
      can?'3   Break the throne: no crown, no more wars'
         :'3   Break the throne (locked, needs '+BREAK_GEMS+' ember gems, you have '+stats.gems+')','',
      'There is no taking this back.'],can?'Press 1, 2 or 3':'Press 1 or 2','#f0d080',true);
  } else if(mode==='choice'){
    drawWorld();drawHud();
    panel('Perrin Ostrander',[
      'The heir of the Drowned Spire stands at the gate, breathing hard.','',
      '1   Return him to House Ostrander: an ally, if a little humbled',
      '2   Hold him as leverage: a bribe, and a house that fears you','',
      'Whatever you choose, House Kest will not forget who emptied their cell.'],'Press 1 or 2','#7fd0ff',true);
  } else if(mode==='win'){
    drawWorld();drawHud();
    const tot=G.items.filter(i=>i.type==='g').length;
    panel('Mission Complete',[G.d.name+' is behind you.','','Ember gems: '+G.gems+' / '+tot+'     Time: '+fmt(G.time),
      'Total gems: '+stats.gems+'  (more gems, longer dragon fire)',''].concat(G.outLines),'Press Enter to continue','#7be08a',true);
  } else if(mode==='lose'){
    drawWorld();drawHud();
    panel('CAUGHT',['Shiloh: ...that went poorly.','Ashling: I said nothing. Loudly.'],'Press Enter to retry the mission','#e05050',true);
  } else if(mode==='end'){
    const epi={
      bribe:'The steward drinks your coin and your secrets. Grell trusts no one now.',
      blackmail:'The chamberlain will keep your secret until he cannot. Tick, tick.',
      poison:'Grell wakes with a headache and a signature he does not remember.',
      null:'You took no favors, and owe none.'}[perk];
    const rank=stats.caught===0?'Ghost':stats.caught<3?'Courier':'Loud';
    const E=G.ending||{title:'Chapter I Complete',lines:[epi],col:'#f0b44c'};
    panel(E.title,E.lines.concat(['','Ember gems: '+stats.gems+' / '+TOTAL_GEMS+'     Times caught: '+stats.caught+'     Time: '+fmt(stats.time),
      'Rank: '+rank+'   ('+DIFFS[diff].name+')','',
      'Houses (Favor/Fear/Ruin):',
      Object.keys(houses).slice(0,3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     '),
      Object.keys(houses).slice(3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     ')]),
      'Press Enter to return to the title',E.col);
  }
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  ctx=MAINCTX;INK=false;SHC=null;SPR=1;   // a bad frame must not leave drawing pointed at a side layer
  const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t/1000;fdt=dt;
  if(RES>1&&mode==='play'){perfT+=t-(frame.prev||t);perfN++;if(perfN>=45){if(perfT/perfN>24)setRes(1);perfT=perfN=0;}}
  frame.prev=t;
  ctx.setTransform(RES,0,0,RES,0,0);
  if(mode==='play')update(dt);
  draw();
  SND.sync();
  // everything sits on warm, grainy paper
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.3;ctx.drawImage(PAPER,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawSoundIcon();
}
requestAnimationFrame(frame);
</script>
