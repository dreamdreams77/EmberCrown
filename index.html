let mode='title',lvl=0,perk=null,G=null,diff=1;
const HOUSE_NAMES={marrow:'Marrow',grell:'Grell',ostrander:'Ostrander',sable:'Sable',kest:'Kest',dunmoor:'Dunmoor'};
let houses={};
function resetHouses(){houses={};for(const k in HOUSE_NAMES)houses[k]={favor:0,fear:0,ruin:0};}
resetHouses();
function rep(){let f=0,e=0,r=0;for(const k in houses){f+=houses[k].favor;e+=houses[k].fear;r+=houses[k].ruin;}
  return{f,e,r,decay:1+.1*Math.min(f,4),sight:Math.max(.8,1-.03*e),gain:1+.05*e,fled:Math.floor(r/2),chaos:1+.05*r};}
function applyOutcome(){
  const L=[];
  const add=(h,t,n,msg)=>{houses[h][t]+=n;L.push('House '+HOUSE_NAMES[h]+': +'+n+' '+t[0].toUpperCase()+t.slice(1)+'. '+msg);};
  if(lvl===0)add('marrow','fear',1,'The thief who walked through their keep.');
  else if(lvl===1){
    if(perk==='bribe')add('grell','favor',1,'The steward remembers your coin.');
    else if(perk==='blackmail')add('grell','fear',1,'The chamberlain keeps your secret, for now.');
    else add('grell','ruin',1,'Grell wakes to a signature he does not remember.');
  } else if(lvl===2){
    add('ostrander','fear',1,'The beacons went dark in one night.');
    add('ostrander','ruin',1,'Forged letters turn their house on itself.');
  } else if(lvl===3){
    add('sable','fear',1,'The ledger names every bribe they took.');
    add('sable','ruin',1,'Their Bell-Warden is silenced.');
  } else if(lvl===4){
    add('kest','fear',1,'Their prize hostage walked out of Ironvale.');
    if(G.choice==='return')add('ostrander','favor',1,'Their heir comes home, unharmed.');
    else add('ostrander','fear',1,'You hold their heir over their heads.');
  } else if(lvl===5){
    add('dunmoor','ruin',1,'The forged treaty is now the first page of their war.');
    add('dunmoor','fear',1,"Veyra's signet is in your pocket.");
  } else if(lvl===6){
    G.ending=finaleEnding(G.choice);
    L.push(G.ending.sum);
  }
  G.outLines=L;
}
function houseCounts(){let f=0,e=0,r=0;for(const k in houses){if(houses[k].favor>0)f++;if(houses[k].fear>0)e++;if(houses[k].ruin>0)r++;}return{f,e,r};}
function finaleEnding(choice){
  const R=rep(),keys=Object.keys(houses);
  if(choice==='puppet'){
    let best=keys[0],bs=-1;
    for(const k of keys){const s=houses[k].fear*2+houses[k].favor;if(s>bs){bs=s;best=k;}}
    houses[best].fear+=1;
    return{title:'Ending: The Puppet Crown',col:'#c8b4ff',
      lines:['House '+HOUSE_NAMES[best]+' wears the crown, and every string runs back to the Hollow Crown.',
        R.e>=4?'The houses obey because they are afraid, not because they agree.':'The houses go along with it. Peace holds, for now.',
        R.f>=2?'A few of them even thank you. Wren does not sleep well anyway.':'Wren holds the strings and does not sleep well.'],
      sum:'House '+HOUSE_NAMES[best]+': crowned, +1 Fear.'};
  }
  if(choice==='burn'){
    for(const k of keys)houses[k].ruin+=1;
    return{title:'Ending: Ash and Ember',col:'#ff9a4a',
      lines:['Ashling burns the throne to slag, and then, with enthusiasm, the hall.',
        R.r>=4?'The houses you ruined along the way have nothing left to rebuild with. The marsh smolders for a generation.':'The houses are bruised, not broken. They rebuild fast, and find a new throne by spring.',
        'Ashling: In my defense, it was very flammable.'],
      sum:'Every house: +1 Ruin.'};
  }
  for(const k of keys)houses[k].favor+=1;
  return{title:'Ending: The Broken Throne',col:'#7be08a',
    lines:['Ashling, full grown, shatters the throne. No crown is left to fight over.',
      R.f>=3?'The houses you helped meet in the rubble and draft a charter. It holds.':'The houses scramble for order. It is a hard winter, but nobody has a crown to steal.',
      'Wren sends one last letter. This time she knows what it says.'],
    sum:'Every house: +1 Favor.'};
}
function finishLevel(){mode='win';applyOutcome();}
const DIFFS=[
 {name:'Courier',range:1,decay:1.3,smoke:1,bell:1,flute:0,blurb:'Gentler guards, extra gadgets'},
 {name:'Spy',range:1.1,decay:1,smoke:0,bell:0,flute:0,blurb:'The intended experience'},
 {name:'Shadow',range:1.2,decay:.7,smoke:-1,bell:-1,flute:-1,blurb:'Sharper eyes, slow recovery, no flute'}];
const stats={gems:0,caught:0,time:0,byLvl:[]};
const TOTAL_GEMS=LEVELS.reduce((s,l)=>s+l.map.join('').split('g').length-1,0);
const BREAK_GEMS=Math.round(TOTAL_GEMS*.6);
const keys={};

/* ---------- helpers ---------- */
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d);}
function solidTile(tx,ty){
  if(tx<0||ty<0||tx>=GW||ty>=GH)return true;
  if(G.flight)return false;
  if(G.grid[ty][tx]==='#')return true;
  const d=G.doors[tx+','+ty];return !!(d&&!d.open);
}
function blocked(x,y,r){
  return solidTile(Math.floor((x-r)/T),Math.floor((y-r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y-r)/T))||
         solidTile(Math.floor((x-r)/T),Math.floor((y+r)/T))||solidTile(Math.floor((x+r)/T),Math.floor((y+r)/T));
}
function inSmoke(x,y){
  return G.smoke.some(s=>Math.hypot(s.x-x,s.y-y)<s.r)||
    (G.state==='ball'&&G.guests&&G.guests.some(s=>Math.hypot(s.x-x,s.y-y)<11));
}
function unstick(c){
  if(!blocked(c.x,c.y,8))return;
  const tx=Math.floor(c.x/T),ty=Math.floor(c.y/T);
  for(let r=1;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=(tx+dx)*T+16,ny=(ty+dy)*T+16;
    if(!blocked(nx,ny,8)){c.x=nx;c.y=ny;return;}
  }
}
function shiftTime(){
  const ts=G.d.timeshift,toRuin=G.state==='ball';
  G.state=toRuin?'ruin':'ball';
  const t=G.guards;G.guards=G.otherGuards;G.otherGuards=t;
  G.grid=G.baseGrid.map(r=>r.slice());
  if(toRuin){
    for(const [x,y] of ts.ruin.open)G.grid[y][x]='.';
    if(G.planted)for(const [x,y] of ts.ruin.openIfPlanted)G.grid[y][x]='.';
    for(const [x,y] of ts.ruin.block)G.grid[y][x]='#';
  }
  G.vents=toRuin?G.ruinVents:[];
  G.rangeMul=G.baseRange*(toRuin?1.1:.9);
  unstick(G.wren);unstick(G.ash);
  G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:220,c:toRuin?'220,130,80':'240,210,130'});
  lureNear(G.wren.x,G.wren.y,8*T);
  say('Wren',toRuin?'Three years on. The hall remembers what it became.':'The ball again. Mind the masks.');
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/6);
  for(let i=1;i<n;i++){
    const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;
    if(solidTile(Math.floor(x/T),Math.floor(y/T))||inSmoke(x,y))return false;
  }
  return true;
}
function say(who,text){G.msg={who,text};G.msgT=4;}

/* ---------- level loading ---------- */
function loadLevel(i){
  const d=LEVELS[i];
  const g={d,grid:[],items:[],doors:{},smoke:[],flames:[],rings:[],active:'wren',alert:0,hold:0,holdT:null,
    time:0,gems:0,msg:null,msgT:0,fireSaid:false,doneSaid:false,sneak:false,gad:{...d.gadgets},exitOpen:false,flight:!!d.flight,vents:[],peds:[],ventSaid:false,gain:1,choice:null,outLines:[],
    host:d.choice?{x:0,y:0,on:false,host:true,face:0}:null};
  const D=DIFFS[diff];
  if(!d.flight)for(const k of ['smoke','bell','flute'])g.gad[k]=Math.max(0,g.gad[k]+D[k]);
  let start,ex;
  d.map.forEach((row,y)=>{
    g.grid[y]=[];
    for(let x=0;x<GW;x++){
      let c=row[x];
      if(c==='S'){start=[x,y];c='.';}
      else if(c==='X'){ex=[x,y];c='.';}
      else if(c==='D'){g.doors[x+','+y]={x,y,open:false};c='.';}
      else if(c==='Z'){g.doors[x+','+y]={x,y,open:false,sealed:true};c='.';}
      else if(c==='T'){g.peds.push({x:x*T+16,y:y*T+16});c='.';}
      else if(c==='V'){g.vents.push({x,y,ph:(x*.7+y*1.3)%4,on:false,warn:false});c='.';}
      else if('gOPBLHC'.includes(c)){g.items.push({x:x*T+16,y:y*T+16,type:c,done:false,p:0});c='.';}
      g.grid[y][x]=c;
    }
  });
  g.exit={x:ex[0]*T+16,y:ex[1]*T+16};
  g.wren={x:start[0]*T+16,y:start[1]*T+16,face:0};
  g.ash={x:g.wren.x+(i>0?T:0),y:g.wren.y,face:0,on:i>0};
  if(g.flight){g.wren.hidden=true;g.ash.x=g.wren.x;g.ash.y=g.wren.y;g.active='ash';}
  const R=rep();
  g.rangeMul=((perk==='poison'&&i===1)?0.75:1)*D.range*R.sight;
  g.decay=((perk==='blackmail'&&i===1)?2.5:1)*D.decay*R.decay;
  g.gain=R.gain;
  const spd=(perk==='poison'&&i===1)?44:56;
  g.guards=d.guards.filter((_,k)=>!(perk==='bribe'&&i===1&&k===d.bribeIdx)).map(wp=>({
    x:wp[0][0]*T+16,y:wp[0][1]*T+16,wp:wp.map(p=>[p[0]*T+16,p[1]*T+16]),i:1,
    face:Math.atan2(wp[1][1]-wp[0][1],wp[1][0]-wp[0][0]),stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd,rm:d.flight?.8:1}));
  if(R.fled>0)g.guards.splice(Math.max(1,g.guards.length-R.fled),Math.min(R.fled,g.guards.length-1));
  for(const x of g.guards)x.spd*=R.chaos;
  if(d.finale){
    const hc=houseCounts(),n=Math.min(3,hc.e);
    if(n>0)g.guards.splice(Math.max(1,g.guards.length-n),Math.min(n,g.guards.length-1));
    g.gad.bell+=Math.min(3,hc.f);
  }
  if(d.boss){const wp=d.boss.wp,cm=d.boss.kind==='candle',bhp=cm?100-8*houseCounts().r:100;
    g.boss={x:wp[0][0]*T+16,y:wp[0][1]*T+16,wp:wp.map(p=>[p[0]*T+16,p[1]*T+16]),i:1,boss:true,kind:d.boss.kind||'warden',hp:bhp,maxhp:bhp,
      blinkT:5,blink:null,hurt:0,dead:false,tollT:4,toll:0,
      face:Math.atan2(wp[1][1]-wp[0][1],wp[1][0]-wp[0][0]),stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd:cm?46:40,rm:1};
    g.guards.push(g.boss);}
  g.noiseT=0;
  for(const t of (d.towers||[]))g.guards.push({x:t[0]*T+16,y:t[1]*T+16,wp:[[t[0]*T+16,t[1]*T+16]],i:0,face:t[2],spin:t[3],
    stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd:0,rm:.8});
  if(d.timeshift){
    const ts=d.timeshift;
    const mk=wp=>({x:wp[0][0]*T+16,y:wp[0][1]*T+16,wp:wp.map(p=>[p[0]*T+16,p[1]*T+16]),i:1,
      face:Math.atan2(wp[1][1]-wp[0][1],wp[1][0]-wp[0][0]),stun:0,pause:0,lure:null,back:null,ret:false,seeing:false,spd:spd*R.chaos,rm:1});
    g.state='ball';g.planted=false;g.shiftSaid=false;
    g.otherGuards=ts.ruin.guards.map(mk);
    if(R.fled>0)g.otherGuards.splice(Math.max(1,g.otherGuards.length-R.fled),Math.min(R.fled,g.otherGuards.length-1));
    g.baseGrid=g.grid.map(r=>r.slice());
    g.ruinVents=(ts.ruin.vents||[]).map(v=>({x:v[0],y:v[1],ph:(v[0]*.7+v[1]*1.3)%4,on:false,warn:false}));
    g.baseRange=g.rangeMul;g.rangeMul=g.baseRange*.9;
    g.guests=ts.guests.map((s,k)=>({a:[s[0][0]*T+16,s[0][1]*T+16],b:[s[1][0]*T+16,s[1][1]*T+16],ph:k*1.7,
      x:s[0][0]*T+16,y:s[0][1]*T+16,c:['#d9a441','#6aa0d9','#c06a9a','#7fc08a'][k%4]}));
  }
  return g;
}
function startBrief(i){lvl=i;mode='brief';}
function startPlay(){G=loadLevel(lvl);mode='play';say(G.flight?'Ashling':'Wren',G.d.opening);}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['tab',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(!e.repeat)press(k);
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

function press(k){
  if(mode==='title'&&['1','2','3'].includes(k))diff=+k-1;
  else if(mode==='title'&&k==='enter'){stats.gems=0;stats.caught=0;stats.time=0;stats.byLvl=[];perk=null;resetHouses();startBrief(0);}
  else if(mode==='choice'&&G.d.finale&&['1','2','3'].includes(k)){
    if(k==='3'&&stats.gems<BREAK_GEMS)return;
    G.choice=['puppet','burn','break'][+k-1];finishLevel();}
  else if(mode==='choice'&&!G.d.finale&&(k==='1'||k==='2')){G.choice=k==='1'?'return':'leverage';finishLevel();}
  else if(mode==='brief'&&k==='enter')startPlay();
  else if(mode==='lose'&&k==='enter')startPlay();
  else if(mode==='win'&&k==='enter'){
    if(lvl===0)mode='court';
    else if(lvl+1<LEVELS.length)startBrief(lvl+1);
    else mode='end';}
  else if(mode==='court'&&['1','2','3'].includes(k)){perk=['bribe','blackmail','poison'][+k-1];startBrief(lvl+1);}
  else if(mode==='end'&&k==='enter')mode='title';
  else if(mode==='play')playPress(k);
}
function playPress(k){
  if(k==='tab'&&G.ash.on&&!G.flight){G.active=G.active==='wren'?'ash':'wren';const a=G.active==='wren'?G.wren:G.ash;G.rings.push({x:a.x,y:a.y,t:.4,r:40,c:'255,255,255'});}
  else if(k==='q')useSmoke();
  else if(k==='r')useBell();
  else if(k==='f')useFlute();
}
function useSmoke(){
  if(G.active!=='wren'||G.gad.smoke<=0)return;
  G.gad.smoke--;G.smoke.push({x:G.wren.x,y:G.wren.y,r:58,t:6});
}
function lureNear(x,y,r,noise){
  for(const g of G.guards){
    if(g.stun>0||(noise&&g.boss))continue;
    if(Math.hypot(g.x-x,g.y-y)<r&&los(g.x,g.y,x,y)){
      if(!g.lure&&!g.ret)g.back={x:g.x,y:g.y};
      g.lure={x,y,t:3};g.ret=false;
    }
  }
}
function useBell(){
  if(G.active!=='wren'||G.gad.bell<=0)return;
  G.gad.bell--;
  const w=G.wren,cx=Math.cos(w.face),cy=Math.sin(w.face);
  let x=w.x,y=w.y;
  for(let i=0;i<4*T;i+=4){
    const nx=w.x+cx*i,ny=w.y+cy*i;
    if(solidTile(Math.floor(nx/T),Math.floor(ny/T)))break;
    x=nx;y=ny;
  }
  G.rings.push({x,y,t:.8,r:100,c:'240,180,76'});
  lureNear(x,y,9*T);
}
function useFlute(){
  if(G.active!=='wren')return;
  if(G.gad.flute<=0){if(G.d.song)say('Wren','I do not know the Song yet. Find the lectern.');return;}
  if(G.d.timeshift){
    for(const p of G.peds)if(Math.hypot(p.x-G.wren.x,p.y-G.wren.y)<46){shiftTime();return;}
  }
  let best=null,bd=3*T;
  for(const k in G.doors){
    const d=G.doors[k];if(d.open)continue;
    const dd=Math.hypot(d.x*T+16-G.wren.x,d.y*T+16-G.wren.y);
    if(dd<bd){bd=dd;best=d;}
  }
  if(!best){say('Wren','Nothing close enough to open.');return;}
  G.gad.flute--;best.open=true;
  G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:140,c:'160,220,255'});
  lureNear(G.wren.x,G.wren.y,8*T);
  say('Ashling','Subtle. Real subtle.');
}

/* ---------- update ---------- */
function moveG(g,tx,ty,dt,spd){
  const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);
  if(d<3)return true;
  g.face=Math.atan2(dy,dx);
  const st=Math.min(d,spd*dt),nx=g.x+dx/d*st,ny=g.y+dy/d*st;
  if(blocked(nx,ny,8))return true;
  g.x=nx;g.y=ny;return false;
}
function stepGuard(g,dt){
  if(g.stun>0){g.stun-=dt;return;}
  if(g.seeing)return;
  if(g.spin){g.face+=g.spin*.7*dt;return;}
  if(g.lure){
    if(moveG(g,g.lure.x,g.lure.y,dt,g.spd*1.3)){g.lure.t-=dt;if(g.lure.t<=0){g.lure=null;g.ret=true;}}
    return;
  }
  if(g.ret){if(moveG(g,g.back.x,g.back.y,dt,g.spd))g.ret=false;return;}
  if(g.pause>0){g.pause-=dt;return;}
  const w=g.wp[g.i];
  if(moveG(g,w[0],w[1],dt,g.spd)){g.i=(g.i+1)%g.wp.length;g.pause=.6;}
}
function completeTarget(t){
  if(t.kind==='door'){t.ref.open=true;return;}
  const it=t.ref;it.done=true;
  if(it.type==='H'){
    G.host.on=true;G.host.x=it.x;G.host.y=it.y;
    say('Perrin','You are the spy? You are shorter than I was told. And is that a dragon?');
  } else if(it.type==='C'){
    const left=G.items.filter(i=>i.type==='C'&&!i.done).length;
    G.rings.push({x:it.x,y:it.y,t:.5,r:50,c:'200,200,255'});
    say('Wren',left?'Snuffed. '+left+' to go.':'The last candle. Now he has nowhere to hide.');
  } else if(it.type==='L'){
    G.song=true;G.gad.flute=999;
    G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:120,c:'160,220,255'});
    say('Wren','The Song of Opening. Press F near a sealed door. It is loud.');
  } else if(it.type==='O'&&G.d.song){say('Wren','The ledger. Every bribe Sable ever took, in one hand.');
  } else if(it.type==='O'){
    if(lvl===0){
      G.ash.on=true;G.ash.x=G.wren.x+14;G.ash.y=G.wren.y+14;
      G.rings.push({x:G.wren.x,y:G.wren.y,t:1,r:90,c:'255,140,60'});
      say('Ashling','Oh. I hatched. Press TAB to swap, SPACE to burn.');
    } else if(G.d.timeshift)say('Wren',"Veyra's signet, still warm from a three-year-old fire.");
    else say('Wren','Seal swapped. Grell will sign his own surrender.');
  } else if(it.type==='P'){
    if(G.d.timeshift){G.planted=true;say('Wren','Treaty planted. Dunmoor will find it, and so will its enemies.');}
    else say(G.flight?'Ashling':'Wren',G.flight?'Letter dropped. Ostrander will find a very convincing forgery.':'One cup. One very bad evening for the guest of honor.');
  }
}
function update(dt){
  G.time+=dt;stats.time+=dt;
  G.candlesLit=G.items.filter(i=>i.type==='C'&&!i.done).length;
  const A=G.active==='wren'?G.wren:G.ash;
  const mx0=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  const my0=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  G.sneak=G.active==='wren'&&!!keys['shift'];
  if(mx0||my0){
    const l=Math.hypot(mx0,my0),mx=mx0/l,my=my0/l;
    A.face=Math.atan2(my,mx);
    const sp=G.active==='wren'?(G.sneak?48:92):135,r=G.active==='wren'?8:10;
    const nx=A.x+mx*sp*dt;if(!blocked(nx,A.y,r))A.x=nx;
    const ny=A.y+my*sp*dt;if(!blocked(A.x,ny,r))A.y=ny;
  }
  // tether: the other one is pulled along if too far
  if(G.ash.on&&!G.flight){
    const O=G.active==='wren'?G.ash:G.wren;
    if(Math.hypot(O.x-A.x,O.y-A.y)>7.5*T){
      G.rings.push({x:O.x,y:O.y,t:.4,r:30,c:'180,120,255'});
      O.x=A.x;O.y=A.y;
      G.rings.push({x:O.x,y:O.y,t:.4,r:30,c:'180,120,255'});
    }
  }
  const moving=!!(mx0||my0);
  // hostage follows Wren
  if(G.host&&G.host.on){
    const h=G.host,w=G.wren,hd=Math.hypot(w.x-h.x,w.y-h.y);
    if(hd>6*T){h.x=w.x;h.y=w.y;}
    else if(hd>30){
      const nx=h.x+(w.x-h.x)/hd*88*dt,ny=h.y+(w.y-h.y)/hd*88*dt;
      h.face=Math.atan2(w.y-h.y,w.x-h.x);
      if(!blocked(nx,h.y,8))h.x=nx;
      if(!blocked(h.x,ny,8))h.y=ny;
    }
  }
  // masked guests drift through the ball (they block sight lines)
  if(G.guests&&G.state==='ball')for(const s of G.guests){
    const q=(1+Math.sin(G.time*.45+s.ph))/2;
    s.x=s.a[0]+(s.b[0]-s.a[0])*q;s.y=s.a[1]+(s.b[1]-s.a[1])*q;
  }
  // forge vents: Wren burns, Ashling does not
  for(const v of G.vents){
    const c=(G.time+v.ph)%4;v.on=c<1.4;v.warn=c>3.3;
    if(v.on&&!G.flight&&Math.hypot(G.wren.x-(v.x*T+16),G.wren.y-(v.y*T+16))<17){
      G.alert+=1.6*dt;
      if(!G.ventSaid){G.ventSaid=true;say('Ashling','Hot. Very hot. For you, anyway.');}
    }
  }
  // silence: noise draws nearby monks (not the deaf Bell-Warden)
  if(G.d.quiet&&moving&&!(G.active==='wren'&&G.sneak)){
    G.noiseT-=dt;
    if(G.noiseT<=0){G.noiseT=.7;lureNear(A.x,A.y,(G.active==='wren'?4:5)*T,true);G.rings.push({x:A.x,y:A.y,t:.35,r:30,c:'150,100,200'});}
  }
  // hold-to-interact (Wren only)
  const holding=keys['e']&&(G.active==='wren'||G.flight);
  if(holding){
    let tgt=null,bd=1e9;
    for(const k in G.doors){
      const d=G.doors[k];if(d.open||d.sealed)continue;
      const dd=Math.hypot(d.x*T+16-A.x,d.y*T+16-A.y);
      if(dd<44&&dd<bd){bd=dd;tgt={kind:'door',ref:d,need:.9};}
    }
    for(const it of G.items){
      if('OPLHC'.includes(it.type)&&!it.done&&
         (!G.d.timeshift||(it.type==='P'?G.state==='ball':it.type==='O'?G.state==='ruin':true))){
        const dd=Math.hypot(it.x-A.x,it.y-A.y);
        if(dd<34&&dd<bd){bd=dd;tgt={kind:'item',ref:it,need:it.type==='H'?1.6:it.type==='C'?.8:1.2};}
      }
    }
    if(tgt&&G.holdT&&G.holdT.ref===tgt.ref)G.hold+=dt;else{G.hold=0;G.holdT=tgt;}
    if(tgt&&G.hold>=tgt.need){completeTarget(tgt);G.hold=0;G.holdT=null;}
  } else {G.hold=0;G.holdT=null;}
  // gems
  for(const it of G.items){
    if(it.type!=='g'||it.done)continue;
    for(const c of [G.flight?null:G.wren,G.ash.on?G.ash:null]){
      if(c&&Math.hypot(it.x-c.x,it.y-c.y)<16){
        it.done=true;G.gems++;
        stats.byLvl[lvl]=Math.max(stats.byLvl[lvl]||0,G.gems);
        stats.gems=stats.byLvl.reduce((a,b)=>a+(b||0),0);
        G.rings.push({x:it.x,y:it.y,t:.5,r:36,c:'255,154,60'});
      }
    }
  }
  // dragon fire
  const firing=G.active==='ash'&&keys[' '];
  if(firing){
    const a=G.ash,range=62+Math.min(stats.gems,12)*8;
    for(let i=0;i<2;i++){
      const dd=Math.random()*range,sp=(Math.random()-.5)*.7;
      G.flames.push({x:a.x+Math.cos(a.face+sp)*dd,y:a.y+Math.sin(a.face+sp)*dd,t:.3,r:4+Math.random()*5});
    }
    const inCone=(x,y)=>{const dx=x-a.x,dy=y-a.y;return Math.hypot(dx,dy)<range&&angDiff(Math.atan2(dy,dx),a.face)<.6&&los(a.x,a.y,x,y);};
    for(const g of G.guards){
      if(g.stun>0||!inCone(g.x,g.y))continue;
      if(g.boss){
        if(g.kind==='candle'&&G.candlesLit>0){
          g.hurt=.1;
          if(!G.shieldSaid){G.shieldSaid=true;say('Ashling','My fire slides right off. The candles are shielding him!');}
        } else if(angDiff(Math.atan2(a.y-g.y,a.x-g.x),g.face)>1.3){
          g.hp-=22*dt;g.hurt=.15;
          if(g.hp<=0){g.hp=0;g.dead=true;g.stun=1e9;
            if(g.kind==='candle')say('Candlemaker','Burn it, crown it, break it. I was always one step ahead.');
            else say('Ashling','The bell is quiet. So is he. Mostly.');}
        } else G.alert=Math.min(.95,G.alert+.5*dt);
      } else {g.stun=5;G.alert=Math.min(.95,G.alert+.15);}
    }
    for(const it of G.items){
      if(it.type==='B'&&!it.done&&inCone(it.x,it.y)){
        it.p+=dt;
        if(it.p>=1){it.done=true;say('Ashling','Signal is out. You are welcome.');}
      }
    }
    if(!G.fireSaid){G.fireSaid=true;say('Ashling','Barbecue time.');}
  } else for(const it of G.items)if(it.type==='B'&&!it.done)it.p=Math.max(0,it.p-dt*.5);
  // detection
  let best=0;
  const targets=G.flight?[]:[G.wren];if(G.ash.on)targets.push(G.ash);
  if(G.host&&G.host.on)targets.push(G.host);
  for(const g of G.guards){
    g.seeing=false;
    if(g.stun>0)continue;
    for(const t of targets){
      const isActive=t.host?true:(t===G.wren)===(G.active==='wren');
      let mul=(t===G.ash?1.45:1)*(isActive?1:.6)*G.rangeMul;
      if(t===G.wren&&G.sneak)mul*=.6;
      const range=5.2*T*mul*(g.rm||1),dx=t.x-g.x,dy=t.y-g.y,dist=Math.hypot(dx,dy);
      if(dist<range&&(dist<T*.9||angDiff(Math.atan2(dy,dx),g.face)<.62)&&los(g.x,g.y,t.x,t.y)){
        g.seeing=true;g.face=Math.atan2(dy,dx);
        best=Math.max(best,.45+(1-dist/range)*1.1);
      }
    }
  }
  if(best>0)G.alert+=best*dt*G.gain;else G.alert-=dt*.22*G.decay;
  G.alert=Math.max(0,G.alert);
  for(const g of G.guards)stepGuard(g,dt);
  // Bell-Warden: the bell tolls; whoever you control must stand still when it lands
  const B=G.boss;
  if(B){
    if(B.hurt>0)B.hurt-=dt;
    if(B.kind==='candle'&&!B.dead){
      // the Candlemaker is always one step ahead: he marks a spot near you, then blinks there
      B.blinkT-=dt;
      if(B.blink){
        B.blink.t-=dt;
        if(B.blink.t<=0){
          const q=B.blink;B.x=q.x;B.y=q.y;B.face=Math.atan2(A.y-B.y,A.x-B.x);B.lure=null;B.ret=false;B.pause=.8;B.blink=null;
          G.rings.push({x:q.x,y:q.y,t:.6,r:70,c:'255,120,60'});
          if(Math.hypot(A.x-q.x,A.y-q.y)<2.2*T){G.alert+=.45;say('Candlemaker','Still one step behind, little courier?');}
        }
      } else if(B.blinkT<=0){
        B.blinkT=8;
        for(let n=0;n<40;n++){
          const ang=Math.random()*6.283,rr=(1.6+Math.random()*1.4)*T,x=A.x+Math.cos(ang)*rr,y=A.y+Math.sin(ang)*rr;
          if(!blocked(x,y,12)){B.blink={x,y,t:1.3};G.rings.push({x,y,t:1.3,r:40,c:'255,120,60'});break;}
        }
      }
    }
    if(!B.dead&&B.kind!=='candle'){
      B.tollT-=dt;
      if(B.tollT<=0&&B.toll<=0){B.tollT=6;B.toll=.9;G.rings.push({x:B.x,y:B.y,t:.9,r:7*T,c:'255,200,80'});
        if(!G.tollSaid){G.tollSaid=true;say('Ashling','The bell! Freeze when it rings!');}}
      if(B.toll>0){B.toll-=dt;
        if(B.toll<=0&&moving&&Math.hypot(A.x-B.x,A.y-B.y)<7*T){G.alert+=.3;say('Wren','It heard me move.');}}
    }
  }
  // timers
  G.smoke=G.smoke.filter(s=>(s.t-=dt)>0);
  G.flames=G.flames.filter(f=>(f.t-=dt)>0);
  G.rings=G.rings.filter(r=>(r.t-=dt)>0);
  if(G.msgT>0)G.msgT-=dt;
  // exit
  const req=G.items.filter(i=>'OPBLHC'.includes(i.type));
  G.exitOpen=req.every(i=>i.done)&&(!G.boss||G.boss.dead);
  if(G.exitOpen&&!G.doneSaid){G.doneSaid=true;say(G.flight?'Ashling':'Wren',G.flight?'Done. Land on the green pad.':'Objectives done. Get Wren to the gate.');}
  const ex=G.flight?G.ash:G.wren;
  if(G.exitOpen&&(G.flight||G.active==='wren')&&Math.hypot(ex.x-G.exit.x,ex.y-G.exit.y)<20
     &&(!G.host||Math.hypot(G.host.x-G.exit.x,G.host.y-G.exit.y)<90)){
    if(G.d.choice||G.d.finale)mode='choice';else finishLevel();
  }
  if(G.alert>=1){mode='lose';stats.caught++;}
}

/* ---------- drawing ---------- */
function panel(title,lines,foot,col,overlay){
  ctx.fillStyle=overlay?'rgba(14,10,17,.86)':'#0e0a11';ctx.fillRect(0,0,800,480);
  ctx.textAlign='center';
  ctx.fillStyle=col||'#f0b44c';ctx.font='bold 38px Georgia';ctx.fillText(title,400,96);
  ctx.font='16px Georgia';ctx.fillStyle='#eadfd0';
  lines.forEach((l,i)=>ctx.fillText(l,400,150+i*26));
  ctx.fillStyle='#9a8aa0';ctx.fillText(foot,400,450);
  ctx.textAlign='left';
}
function visPoly(g,range){
  const half=.62,pts=[[g.x,g.y]];
  for(let i=0;i<=20;i++){
    const a=g.face-half+half*2*i/20;let r=0;
    for(;r<range;r+=6)if(solidTile(Math.floor((g.x+Math.cos(a)*r)/T),Math.floor((g.y+Math.sin(a)*r)/T)))break;
    pts.push([g.x+Math.cos(a)*r,g.y+Math.sin(a)*r]);
  }
  return pts;
}
function drawWorld(){
  const p=(G.state==='ruin'&&G.d.palRuin)?G.d.palRuin:G.d.pal;
  ctx.fillStyle='#120c16';ctx.fillRect(0,0,800,480);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(G.grid[y][x]==='#'){ctx.fillStyle=p.w;ctx.fillRect(x*T,y*T,T,T);ctx.fillStyle=p.wt;ctx.fillRect(x*T,y*T,T,4);}
    else{ctx.fillStyle=(x+y)%2?p.f1:p.f2;ctx.fillRect(x*T,y*T,T,T);}
  }
  for(const k in G.doors){
    const d=G.doors[k];
    if(d.open){ctx.fillStyle='#4a3420';ctx.fillRect(d.x*T+4,d.y*T+12,T-8,8);}
    else if(d.sealed){
      ctx.fillStyle='#3b2a5a';ctx.fillRect(d.x*T+3,d.y*T+1,T-6,T-2);
      ctx.strokeStyle='#b99cff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x*T+16,d.y*T+7);ctx.lineTo(d.x*T+23,d.y*T+16);ctx.lineTo(d.x*T+16,d.y*T+25);ctx.lineTo(d.x*T+9,d.y*T+16);ctx.closePath();ctx.stroke();
    }
    else{ctx.fillStyle='#7a5230';ctx.fillRect(d.x*T+3,d.y*T+3,T-6,T-6);ctx.fillStyle='#d8a24a';ctx.fillRect(d.x*T+T-11,d.y*T+14,4,4);}
  }
  // forge vents
  for(const v of G.vents){
    const vx=v.x*T,vy=v.y*T;
    ctx.fillStyle='#120a0a';ctx.fillRect(vx+4,vy+4,T-8,T-8);
    ctx.strokeStyle='#3a2a28';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(vx+6,vy+9+i*7);ctx.lineTo(vx+T-6,vy+9+i*7);ctx.stroke();}
    if(v.warn){ctx.fillStyle='rgba(255,120,40,.35)';ctx.fillRect(vx+4,vy+4,T-8,T-8);}
    if(v.on){
      ctx.fillStyle='rgba(255,'+(100+Math.random()*80|0)+',30,.85)';ctx.beginPath();ctx.arc(vx+16,vy+16,13+Math.random()*3,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,230,140,.8)';ctx.beginPath();ctx.arc(vx+16,vy+16,6,0,7);ctx.fill();
    }
  }
  // time pedestals
  for(const pd of G.peds){
    ctx.fillStyle='#2a2040';ctx.beginPath();ctx.arc(pd.x,pd.y,13,0,7);ctx.fill();
    ctx.strokeStyle=G.state==='ruin'?'#e0a070':'#b9c8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(pd.x,pd.y,13,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(pd.x,pd.y,6,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pd.x,pd.y-6);ctx.lineTo(pd.x,pd.y+6);ctx.moveTo(pd.x-6,pd.y);ctx.lineTo(pd.x+6,pd.y);ctx.stroke();
  }
  // exit
  const exw=G.d.exitLabel?26:14;
  ctx.fillStyle=G.exitOpen?'#2f7a47':'#2b3a30';ctx.fillRect(G.exit.x-exw,G.exit.y-14,exw*2,28);
  ctx.fillStyle=G.exitOpen?'#bff5cf':'#667a6c';ctx.font='bold 10px Georgia';ctx.textAlign='center';ctx.fillText(G.d.exitLabel||'EXIT',G.exit.x,G.exit.y+4);ctx.textAlign='left';
  // items
  for(const it of G.items){
    if(it.type==='g'){
      if(it.done)continue;
      ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.moveTo(it.x,it.y-9);ctx.lineTo(it.x+7,it.y);ctx.lineTo(it.x,it.y+9);ctx.lineTo(it.x-7,it.y);ctx.fill();
      ctx.fillStyle='#ffe0a8';ctx.fillRect(it.x-1,it.y-4,2,5);
      continue;
    }
    ctx.globalAlpha=it.done?.3:(G.d.timeshift&&((it.type==='P'&&G.state!=='ball')||(it.type==='O'&&G.state!=='ruin')))?.22:1;
    if(it.type==='O'){
      if(G.d.song){ctx.fillStyle='#6a3a2a';ctx.fillRect(it.x-9,it.y-8,18,16);ctx.fillStyle='#e0b040';ctx.fillRect(it.x-7,it.y-6,3,12);ctx.fillStyle='#eadfd0';ctx.fillRect(it.x-3,it.y-6,10,12);}
      else if(lvl===0){ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.ellipse(it.x,it.y,9,12,0,0,7);ctx.fill();ctx.strokeStyle='#d8a24a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#b8a888';ctx.fillRect(it.x-3,it.y-3,2,2);ctx.fillRect(it.x+2,it.y+3,2,2);}
      else{ctx.fillStyle='#e0b040';ctx.beginPath();ctx.arc(it.x,it.y,10,0,7);ctx.fill();ctx.fillStyle='#7a5a10';ctx.font='bold 12px Georgia';ctx.textAlign='center';ctx.fillText('S',it.x,it.y+4);ctx.textAlign='left';}
    } else if(it.type==='C'){
      ctx.fillStyle='#d8d0b8';ctx.fillRect(it.x-4,it.y-2,8,12);
      if(!it.done){
        ctx.fillStyle='rgba(255,170,60,.13)';ctx.beginPath();ctx.arc(it.x,it.y-4,70,0,7);ctx.fill();
        ctx.fillStyle='#ffb040';ctx.beginPath();ctx.moveTo(it.x,it.y-14);ctx.lineTo(it.x+5,it.y-3);ctx.lineTo(it.x-5,it.y-3);ctx.fill();
        ctx.fillStyle='#fff0b0';ctx.fillRect(it.x-1,it.y-8,2,5);
      } else {ctx.fillStyle='#777';ctx.fillRect(it.x-1,it.y-6,2,4);}
    } else if(it.type==='H'){
      if(!it.done){
        ctx.fillStyle='#7fd0ff';ctx.beginPath();ctx.arc(it.x,it.y,8,0,7);ctx.fill();
        ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(it.x-12,it.y+8);ctx.lineTo(it.x-5,it.y+3);ctx.moveTo(it.x+12,it.y+8);ctx.lineTo(it.x+5,it.y+3);ctx.stroke();
      }
    } else if(it.type==='L'){
      ctx.fillStyle='#6a4a30';ctx.fillRect(it.x-8,it.y-2,16,10);ctx.fillStyle='#eadfd0';ctx.fillRect(it.x-7,it.y-8,14,7);
      ctx.fillStyle='#9fd8ff';ctx.fillRect(it.x-1,it.y-6,2,4);
    } else if(it.type==='P'&&(G.flight||G.d.timeshift)){
      ctx.fillStyle='#eadfd0';ctx.fillRect(it.x-9,it.y-6,18,12);ctx.fillStyle='#c44a4a';ctx.beginPath();ctx.arc(it.x,it.y,3,0,7);ctx.fill();
    } else if(it.type==='P'){
      ctx.fillStyle='#9b5de5';ctx.beginPath();ctx.moveTo(it.x-8,it.y-9);ctx.lineTo(it.x+8,it.y-9);ctx.lineTo(it.x+4,it.y+2);ctx.lineTo(it.x-4,it.y+2);ctx.fill();ctx.fillRect(it.x-1,it.y+2,2,7);ctx.fillRect(it.x-6,it.y+9,12,2);
    } else if(it.type==='B'){
      ctx.fillStyle='#555';ctx.fillRect(it.x-9,it.y,18,9);
      ctx.fillStyle=it.done?'#3a2a2a':'#ff6a2a';ctx.beginPath();ctx.arc(it.x,it.y-3,it.done?4:8,0,7);ctx.fill();
      if(!it.done&&it.p>0){ctx.strokeStyle='#ffd27a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(it.x,it.y-3,14,-1.57,-1.57+6.28*it.p);ctx.stroke();}
    }
    ctx.globalAlpha=1;
    if(G.holdT&&G.holdT.ref===it&&G.hold>0){ctx.strokeStyle='#f0b44c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(it.x,it.y,16,-1.57,-1.57+6.28*Math.min(1,G.hold/G.holdT.need));ctx.stroke();}
  }
  for(const k in G.doors){
    const d=G.doors[k];
    if(G.holdT&&G.holdT.ref===d&&G.hold>0){ctx.strokeStyle='#f0b44c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(d.x*T+16,d.y*T+16,18,-1.57,-1.57+6.28*Math.min(1,G.hold/G.holdT.need));ctx.stroke();}
  }
  // vision cones
  for(const g of G.guards){
    if(g.stun>0)continue;
    const pts=visPoly(g,5.2*T*G.rangeMul*(g.rm||1));
    ctx.fillStyle=g.seeing?'rgba(255,70,70,.28)':'rgba(255,225,110,.13)';
    ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.fill();
  }
  // masked guests
  if(G.guests&&G.state==='ball')for(const s of G.guests){
    ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,9,0,7);ctx.fill();
    ctx.fillStyle='rgba(20,10,30,.7)';ctx.fillRect(s.x-6,s.y-3,12,4);
  }
  // bell
  if(G.d.bellAt){const bx=G.d.bellAt[0]*T+16,by=G.d.bellAt[1]*T+16;
    ctx.fillStyle='#8a6a20';ctx.beginPath();ctx.arc(bx,by,15,0,7);ctx.fill();
    ctx.fillStyle='#e0b040';ctx.beginPath();ctx.arc(bx,by-2,11,0,7);ctx.fill();
    ctx.fillStyle='#3a2a10';ctx.beginPath();ctx.arc(bx,by+4,3,0,7);ctx.fill();}
  // guards
  for(const g of G.guards){
    const rad=g.boss?16:10;
    ctx.fillStyle=g.dead?'#443a50':g.boss?(g.hurt>0?'#ffb0b0':'#6a3f9a'):g.stun>0?'#777':G.d.quiet?'#8a5fb0':'#c44a4a';
    ctx.beginPath();ctx.arc(g.x,g.y,rad,0,7);ctx.fill();
    if(g.boss&&!g.dead){ctx.strokeStyle='#e0b040';ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.x,g.y,rad+3,0,7);ctx.stroke();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x+Math.cos(g.face)*(rad-4),g.y+Math.sin(g.face)*(rad-4),3,0,7);ctx.fill();
    if(g.stun>0&&!g.dead){ctx.fillStyle='#ffd27a';ctx.font='bold 12px Georgia';ctx.fillText('zz',g.x-7,g.y-14);}
    if(g.boss&&!g.dead){ctx.fillStyle='#2a2030';ctx.fillRect(g.x-22,g.y-27,44,6);ctx.fillStyle='#e05050';ctx.fillRect(g.x-22,g.y-27,44*Math.max(0,g.hp)/(g.maxhp||100),6);}
  }
  // smoke
  for(const s of G.smoke){ctx.fillStyle='rgba(205,205,215,'+Math.min(.55,s.t/3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  // characters
  if(G.host&&G.host.on){
    const h=G.host;
    ctx.fillStyle='#7fd0ff';ctx.beginPath();ctx.arc(h.x,h.y,8,0,7);ctx.fill();
    ctx.fillStyle='#1d4a63';ctx.beginPath();ctx.arc(h.x+Math.cos(h.face)*3,h.y+Math.sin(h.face)*3,3,0,7);ctx.fill();
  }
  const w=G.wren;
  if(!w.hidden){
  ctx.fillStyle='#c8b4ff';ctx.beginPath();ctx.arc(w.x,w.y,9,0,7);ctx.fill();
  ctx.fillStyle='#3a2a5a';ctx.beginPath();ctx.arc(w.x-Math.cos(w.face)*2,w.y-Math.sin(w.face)*2,6,0,7);ctx.fill();}
  if(G.sneak){ctx.strokeStyle='rgba(200,180,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(w.x,w.y,13,0,7);ctx.stroke();}
  if(G.ash.on){
    const a=G.ash;
    ctx.fillStyle='#b8501c';ctx.beginPath();ctx.moveTo(a.x-4,a.y);ctx.lineTo(a.x-16,a.y-9);ctx.lineTo(a.x-12,a.y+7);ctx.fill();
    ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.arc(a.x,a.y,11,0,7);ctx.fill();
    ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(a.x+Math.cos(a.face)*7,a.y+Math.sin(a.face)*7,4,0,7);ctx.fill();
  }
  const act=G.active==='wren'?G.wren:G.ash;
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(act.x,act.y,G.active==='wren'?13:16,0,7);ctx.stroke();
  // fx
  for(const f of G.flames){ctx.fillStyle='rgba(255,'+(120+Math.random()*100|0)+',40,'+(f.t/.3)+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();}
  for(const r of G.rings){const k=1-r.t/(r.t0||1);ctx.strokeStyle='rgba('+r.c+','+Math.min(1,r.t*2)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r*(1-Math.min(1,r.t)),0,7);ctx.stroke();}
  if(G.boss&&G.boss.blink){
    const q=G.boss.blink;ctx.strokeStyle='rgba(255,130,60,'+(.5+.5*Math.sin(G.time*14))+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(q.x,q.y,18,0,7);ctx.stroke();ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.stroke();
  }
  if(G.d.finale){ctx.fillStyle='rgba(0,0,15,'+(.08+(5-Math.min(5,G.candlesLit))*.07)+')';ctx.fillRect(0,0,800,480);}
  if(G.state==='ruin'){ctx.fillStyle='rgba(70,20,10,.2)';ctx.fillRect(0,0,800,480);}
  else if(G.state==='ball'){ctx.fillStyle='rgba(40,60,130,.07)';ctx.fillRect(0,0,800,480);}
}
function drawHud(){
  ctx.fillStyle='rgba(10,6,12,.85)';ctx.fillRect(0,0,800,26);ctx.fillRect(0,454,800,26);
  ctx.font='bold 13px Georgia';
  let x=8;
  ctx.fillStyle='#f0b44c';ctx.fillText(G.d.name,x,18);x+=ctx.measureText(G.d.name).width+16;
  for(const t of ['L','H','C','O','P','B','W']){
    const l=G.d.labels[t];if(!l)continue;
    let its,n,done;
    if(t==='W'){done=!!G.boss.dead;its=[0];n=done?1:0;}
    else{its=G.items.filter(i=>i.type===t);n=its.filter(i=>i.done).length;done=n===its.length;}
    ctx.fillStyle=done?'#7be08a':'#eadfd0';
    const s=(done?'[x] ':'[ ] ')+l+(its.length>1?' '+n+'/'+its.length:'');ctx.fillText(s,x,18);x+=ctx.measureText(s).width+14;
  }
  ctx.fillStyle='#eadfd0';
  const who=G.active==='wren'?'Wren':'Ashling';
  const tab=G.ash.on?'  TAB swap':'';
  ctx.fillText(G.d.timeshift?'Q Smoke '+G.gad.smoke+'  R Bell '+G.gad.bell+'  F Time (at pedestal)  '+(G.state==='ball'?'BALL':'RUINS')+'  Gems '+stats.gems+'  '+who+tab
    :G.flight?'Space fire   E (hold) drop letter   Gems '+stats.gems+'   '+DIFFS[diff].name
    :'Q Smoke '+G.gad.smoke+'   R Bell '+G.gad.bell+'   F Flute '+(G.gad.flute>50?'Song':G.gad.flute)+'   Gems '+stats.gems+'   Playing: '+who+tab,8,472);
  ctx.fillText('Suspicion',590,472);
  ctx.fillStyle='#2a2030';ctx.fillRect(660,461,130,12);
  const a=Math.min(1,G.alert);
  ctx.fillStyle=a<.5?'#7be08a':a<.8?'#f0b44c':'#e05050';ctx.fillRect(660,461,130*a,12);
  ctx.strokeStyle='#9a8aa0';ctx.lineWidth=1;ctx.strokeRect(660.5,461.5,130,12);
  if(G.msgT>0&&G.msg){
    ctx.fillStyle='rgba(10,6,12,'+Math.min(.85,G.msgT)+')';ctx.fillRect(110,414,580,30);
    ctx.globalAlpha=Math.min(1,G.msgT);
    ctx.fillStyle=G.msg.who==='Ashling'?'#ff9a4a':G.msg.who==='Perrin'?'#7fd0ff':G.msg.who==='Candlemaker'?'#f0d080':'#c8b4ff';ctx.fillText(G.msg.who+':',122,434);
    ctx.fillStyle='#eadfd0';ctx.fillText(G.msg.text,122+ctx.measureText(G.msg.who+': ').width+4,434);
    ctx.globalAlpha=1;
  }
}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function draw(){
  if(mode==='title'){
    panel('EMBERCROWN',[
      'A spy. A runt dragon. Seven feuding houses. One engineered war.','',
      'WASD / Arrows  move          Shift  sneak',
      'E (hold)  pick lock, steal, poison          Space  dragon fire',
      'Q  smoke powder      R  whisper bell      F  bone flute (opens a door, loud)',
      'Tab  swap Wren / Ashling (after you find the egg)','',
      'Stay out of the yellow cones. Do not let Suspicion fill.','',
      'Difficulty (press 1, 2 or 3):   '+DIFFS.map((d,i)=>(i===diff?'[ ':'  ')+(i+1)+' '+d.name+(i===diff?' ]':'  ')).join('   '),
      DIFFS[diff].blurb],'Press Enter to begin  -  Chapter I: The Hollow Crown');
  } else if(mode==='brief'){
    const d=LEVELS[lvl];
    const R=rep(),extra=(R.f+R.e+R.r>0)?['','Standing: Favor '+R.f+'   Fear '+R.e+'   Ruin '+R.r,
      'Suspicion fades '+Math.round((R.decay-1)*100)+'% faster   Guard sight -'+Math.round((1-R.sight)*100)+'%   Alert gain +'+Math.round((R.gain-1)*100)+'%   Guards fled '+R.fled]:[];
    let fin=[];
    if(d.finale){const hc=houseCounts();
      fin=['Favor sends +'+Math.min(3,hc.f)+' whisper bells   Fear stands down '+Math.min(3,hc.e)+' guards   Ruin: he starts at '+(100-8*hc.r)+' HP'];}
    panel(d.name,['Mission '+(lvl+1)+'  -  '+d.house,''].concat(d.intro,extra,fin),'Press Enter to begin');
  } else if(mode==='court'){
    panel('The Whisper Court',[
      'Before Gallowmere you may turn one servant of House Grell.','',
      '1   Bribe the steward  -  one guard sleeps through the feast',
      '2   Blackmail the chamberlain  -  suspicion fades much faster',
      '3   Taint the wine  -  guards are drowsy: shorter sight, slower steps','',
      'Every favor has a price. The houses will remember.'],'Press 1, 2 or 3');
  } else if(mode==='play'){
    drawWorld();drawHud();
  } else if(mode==='choice'&&G.d.finale){
    drawWorld();drawHud();
    const can=stats.gems>=BREAK_GEMS;
    panel('The Throne of Hallow',[
      'The Candlemaker is dead. The throne is yours to decide.','',
      '1   Crown a puppet  -  peace, held by strings',
      '2   Burn it all down  -  Ashling finishes what the war began',
      can?'3   Break the throne  -  no crown, no more wars'
         :'3   Break the throne  -  locked: needs '+BREAK_GEMS+' ember gems (you have '+stats.gems+')','',
      'There is no taking this back.'],can?'Press 1, 2 or 3':'Press 1 or 2','#f0d080',true);
  } else if(mode==='choice'){
    drawWorld();drawHud();
    panel('Perrin Ostrander',[
      'The heir of the Drowned Spire stands at the gate, breathing hard.','',
      '1   Return him to House Ostrander  -  an ally, if a little humbled',
      '2   Hold him as leverage  -  a bribe, and a house that fears you','',
      'Whatever you choose, House Kest will not forget who emptied their cell.'],'Press 1 or 2','#7fd0ff',true);
  } else if(mode==='win'){
    drawWorld();drawHud();
    const tot=G.items.filter(i=>i.type==='g').length;
    panel('Mission Complete',[G.d.name+' is behind you.','','Ember gems: '+G.gems+' / '+tot+'     Time: '+fmt(G.time),
      'Total gems: '+stats.gems+'  (more gems, longer dragon fire)',''].concat(G.outLines),'Press Enter to continue','#7be08a',true);
  } else if(mode==='lose'){
    drawWorld();drawHud();
    panel('CAUGHT',['Wren: ...that went poorly.','Ashling: I said nothing. Loudly.'],'Press Enter to retry the mission','#e05050',true);
  } else if(mode==='end'){
    const epi={
      bribe:'The steward drinks your coin and your secrets. Grell trusts no one now.',
      blackmail:'The chamberlain will keep your secret until he cannot. Tick, tick.',
      poison:'Grell wakes with a headache and a signature he does not remember.',
      null:'You took no favors, and owe none.'}[perk];
    const rank=stats.caught===0?'Ghost':stats.caught<3?'Courier':'Loud';
    const E=G.ending||{title:'Chapter I Complete',lines:[epi],col:'#f0b44c'};
    panel(E.title,E.lines.concat(['','Ember gems: '+stats.gems+' / '+TOTAL_GEMS+'     Times caught: '+stats.caught+'     Time: '+fmt(stats.time),
      'Rank: '+rank+'   ('+DIFFS[diff].name+')','',
      'Houses (Favor/Fear/Ruin):',
      Object.keys(houses).slice(0,3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     '),
      Object.keys(houses).slice(3).map(k=>HOUSE_NAMES[k]+' '+houses[k].favor+'/'+houses[k].fear+'/'+houses[k].ruin).join('     ')]),
      'Press Enter to return to the title',E.col);
  }
}
let last=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(mode==='play')update(dt);
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
