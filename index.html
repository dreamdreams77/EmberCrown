<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Embercrown: a stealth-action RPG of a spy, a runt dragon, and seven feuding houses.">
<title>Embercrown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="title">
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Embercrown game view"></canvas>
    <button id="pausebtn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
  <div id="touch">
    <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>
    <div id="btns">
      <button type="button" class="tb sm gad" data-act="smoke"><span>SMOKE</span><i>0</i></button>
      <button type="button" class="tb sm gad" data-act="bell"><span>BELL</span><i>0</i></button>
      <button type="button" class="tb sm gad" data-act="flute"><span>FLUTE</span><i>0</i></button>
      <button type="button" class="tb sm" data-act="swap"><span>SWAP</span></button>
      <button type="button" class="tb" data-act="shift"><span>SNEAK</span></button>
      <button type="button" class="tb big act" data-act="act"><span>ACT</span></button>
      <button type="button" class="tb big fire" data-act="fire"><span>FIRE</span></button>
    </div>
  </div>
  <div id="ui"></div>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/cine.js"></script>
<script src="js/props.js"></script>
<script src="js/talents.js"></script>
<script src="js/combat.js"></script>
<script src="js/actors.js"></script>
<script src="js/world.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
